 da vaga. Em realização de alinhamentos com a Analista de Atração e Seleção."], [null, "% Demissões Voluntárias ", null, 0.0333, 0.0408, 1.2252252252252251, "A Unidade encerrou agostocom 49 colaboradores, registrando 1 admissão e 1 demissão no mês, mantendo o quadro de pessoal estável. No acumulado do ano, foram contabilizadas 4 admissões e 4 demissões, sendo duas demissões voluntárias.\n\nO turnover acumulado está em 8,3%, com projeção de 14,3% para o encerramento de 2026. A tendência permanece 4,2 pontos percentuais abaixo do limite anual estabelecido de 18,5%, representando utilização de 77,3% do parâmetro máximo.", "Demissões voluntárias : Salva Vidas que obteve uma melhor proposta de trabalho em outra área de sua formação. Uma Jovem Aprendiz que sua família mudou de cidade, e um Instrutor de Esporte que optou por empreender. Desligamentos : Recreadora e Assistente financeiro por questões comportamentais e de baixa entrega. "], [null, "NPS", null, 0.873, 0.787, 0.787, "Impacto devido ao NPS Escola de Esportes\nSesc Mov (Nota 92): O altíssimo índice de satisfação é justificado pela excelência na organização e pela variedade da programação, consolidando o evento como referência institucional e motivando a ampliação de ações transversais.\nSesc Miniférias (Nota 84,6): O resultado expressivo e a alta taxa de resposta (50%) decorrem do alinhamento de expectativas com as famílias. A estratégia do \"Dia D\" mitigou ruídos de comunicação, gerando forte relação de confiança e segurança com os responsáveis.\nSesc Fitness (Nota 80,7): O indicador na zona de excelência é sustentado diretamente pelo capital humano. O atendimento atencioso e profissional dos instrutores compensou e blindou a percepção do cliente frente às necessidades de melhorias na infraestrutura e manutenção dos equipamentos (já mapeadas e em correção).                                                                                                           Sesc Escola de Esportes (Nota 65,9): O indicador de excelência ficou no capital humano, bons professores, atendimento atencioso, contudo tivemos pontuações da piscina fria (Natação) e Futsal pontuação de tempo de bola/jogo de alunos, atraso do professor (reunimos com o Lucas) e crianças maiores (momentos de chuvas e intempéries no qual devido a quadra descoberta temos de unir turmas).                                                                                                              Sesc Cursos de Cultura - (Nota 82.9)-Principais pontuações positivas instrutores engajados e neutros solicitando a participação em mais eventos e festivais com os alunos.                                                                                                                                                             Sesc Reforço Escolar (Nota 97) - O indicador e excelência ficou no capital humano (professores), e infraestrutura.", "A reclamação com maior apontamento tratou-se do Sesc Fitness, Academia- em principal dos equipamentos obsoletos e demora na manutenção (esteiras). Temos planejado para outubro/novembro a substituição dos equipamentos da academia, onde o novo contrato contemplará equipamentos mais modernos e a manutenção períodica e/ou até mesmo substituição de equipamentos defeituosos.Pontos fortes, atendimento dos instrutores. Ressaltamos que a empresa Jawa responsável pela manutenção apresentou retorno tardio nas manutenções,todos pontuados junto as áreas técnicas (GEL e GEINFRA).Outro fator com nota baixa 65,9% para a Escola de Esportes -Natação piscina fria e Futsal (crianças menores junto com maiores) em momentos de chuvas e intempéries (em principal no inicio do ano -devido a obtermos uma quadra descoberta-sendo necessário unir turmas no ginásio). Mas já estamos com plano de ação para cobertura das quadras, melhorando a infra-estrutura.Para os cursos de cultura- a participação em mais eventos e festivais de dança."], [null, null, null, null, null, null, null, null], ["Gestão Financeira ", "Execução Financeira - Corrente", null, 6585538, 6225060.48, 0.9452622519223184, "Sem discrepâncias- dentro da meta estabelecida pela instituição", "Sem necessidade de elaboração de plano de ação. Necessário acompanhamento sistemático dos números."], [null, "Execução Financeira - Capital ", null, 190820, 174444.05, 0.9141811654962791, "O orçamento total foi de R$ 6.585.538,00, com realização de R$ 6.225.060,48, resultando em execução de 94,53% e saldo orçamentário de R$ 360.477,52, equivalente a 5,47% abaixo do previsto. Apesar do resultado global favorável, existem desvios relevantes entre atividades e pacotes que precisam ser considerados na análise gerencial.\n\nO saldo global está concentrado, principalmente, na menor realização de Sesc Fitness - Academia (locações de equipamentos de academia- ainda em processo licitatório), Turismo Emissivo (Notas fiscais ainda não contabilizada pela Ag~encia de Tursimo), Sesc Mais Lazer, Sesc +60 - Oficina (notas fiscais de prestação de serviços do Senac ainda não contabilizadas), Rede Sesc Ação Comunitária - Feira (contratação de locação de tendas para feiras- ação que não será realizada estamos utilizando as tendas da Unidade) e Natação (impacto no pessoal-com a solicitação de desligamento de um instrutor-Guilherme).", "Sem ajustes, apenas acompanhamentos."], [null, "Execução Financeira - PCG", null, "SBI COM ERRO", "SBI COM ERRO", "-", "Sem discrepâncias- dentro da meta estabelecida pela instituição (receitas e despesas sendo executadas dentro do planejado)", "Acompanhar os lançamentos e verifcar com as áreas técnicas e contabilidade o rastreio das despesas que ainda não foram computadas. "], [null, "Resultado Operacional (Subsídio) ", null, 5594438, 5309817.79, 0.9491244321592267, "Sem discrepâncias- dentro da meta estabelecida pela instituição (receitas e despesas sendo executadas dentro do planejado)", "Sem discrepâncias- dentro da meta estabelecida pela instituição (receitas e despesas sendo executadas dentro do planejado)"], [null, "R$ Receitas Serviços ", null, 1181920, 1089686.74, 0.9219631954785433, "A receita realizada atingiu R$ 1.089.686,74, frente ao orçamento de R$ 1.181.920,00, resultando em déficit de R$ 92.233,26 e execução de 92,2%.\n\nResultados acima do orçamento:\n\nTaekwondo: +R$ 5.385,44 (118,3% de execução);\n Futsal: +R$ 8.779,33 (111,9%);\n Sesc Fitness - Academia: +R$ 5.685,83 (101,3%);\n Sesc Cursos de Arte e Cultura (Dança): +R$ 4.871,29 (105,3%);\n Anuidade Clube: +R$ 4.555,00 (107,9%);\n Pilates Solo: +R$ 2.398,34 (102,6%);\n Natação: +R$ 357,76 (100,5%);\n Assessoria de Corrida: +R$ 262,20 (101,2%);\n Miniférias: +R$ 0,28 (100,0%).\n\nResultados abaixo do orçamento:\n\nTurismo Emissivo: -R$ 121.240,66 (49,6% de execução);- Excursão para o Sesc Pantanal os valores foram alocados apenas para Setembro.\n Hidroginástica: -R$ 2.867,08 (31,6%);\n Cessão de Espaço Lazer: -R$ 1.159,00 (45,6%);\n Iniciação Esportiva: -R$ 1.276,65 (91,6%);\n Avaliação Física: -R$ 99,00 (88,5%);\n Day Use: -R$ 0,10 (99,9%).\n", "\nPLANO DE AÇÃO EM ANEXO A PASTA: Os principais desvios estão concentrados nos indicadores de ocupação, especialmente em Natação (62 vagas), Pilates Solo (54 vagas) e Futsal (45 vagas), demonstrando a necessidade de ações de retenção e captação de alunos. A estratégia mais efetiva tende a ser a combinação de busca ativa de faltosos, contato com evadidos e campanhas de indicação, uma vez que possuem menor custo e impacto mais rápido.\n\nNo indicador de presenças, o maior desafio está em Dança, com déficit de 1.755 presenças. A participação em eventos externos, aliada à revisão da grade de modalidades e ampliação da oferta de aulas, pode contribuir significativamente para a recuperação do indicador.\n\nJá nos indicadores de TCBST, tanto em Reforço Escolar quanto em Sesc +60, o problema está mais relacionado ao perfil cadastral do público atendido do que ao volume de participantes. Assim, ações de recadastramento e direcionamento da captação para comerciários e dependentes tendem a gerar resultado mais rapidamente do que o simples aumento de matrículas.\n\nPrioridade de atuação: Natação, Pilates Solo, Futsal e Dança, por apresentarem os maiores impactos nos indicadores estratégicos da unidade."], [null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null], [null, null, null, "Cálculo Subsídio", null, null, null, null], [null, null, null, null, null, null, null, null], [null, null, null, 6776358, 6399504.53, null, null, null], [null, null, null, 1181920, 1089686.74, null, null, null], [null, null, null, 5594438, 5309817.79, 284620.20999999996, null, null], [null, null, null, 0.8255818243369079, 0.8297232645290431, null, null, null]], "Análise das Atividades": [[null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null], ["Relação Receita x Despesas x Ocupação x Produção - janeiro à agosto", null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null], ["PROGRAMA", "Curso/ Atividade", "Receita", null, null, "Despesas", null, null, "Subsídio", "Ocupação (agosto)", null, null, null, null, "Produção", null, null, null, "Percapita sobre presença ", "Produção", null, null, null, "Percapita sobre pessoas atendida  "], [null, null, "Orçado", "Realizado", "% desvio", "Planejado", "Realizado", "% desvio", null, "Vagas Planejadas (alunos/clientes)", "vagas Ocupadas (alunos/clientes)", "vagas ocupadas  por TCBST / Dep", "% OCUPAÇÃO ", "% TCBST", "Variável", "Planejado ", "Realizado", "%Desvio", null, "Variável", "Planejado ", "Realizado", "%Desvio", null], ["EDUCAÇÃO", "Reforço Escolar", 0, 0, "-", 443859, 451425.84, 1.0170478462755064, 1, 216, 203, 99, 0.9398148148148148, 0.4876847290640394, "PRESENÇA", 7757, 7136, 0.9199432770400928, 63.26034753363229, "PESSOAS ATENDIDAS", 285, 321, 1.126315789473 function kpi(label,value,sub,type='number'){return`<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${fmt(value,type)}</div><div class="sub">${esc(sub)}</div></div>`}
function card(title,sub,content,cl=''){return`<section class="card ${cl}"><h3>${title}</h3><div class="sub">${sub}</div>${content}</section>`}
function hit(text,obj){let id=detail.push(obj)-1;return`class="hit" tabindex="0" role="button" data-id="${id}" data-tip="${esc(text)}" aria-label="${esc(text)}"`}
function svg(content,h=240){return`<div style="max-height:340px;overflow:auto"><svg class="chart" style="${h>320?'height:'+h+'px;min-height:'+h+'px;max-height:none':''}" viewBox="0 0 600 ${h}" role="img">${content}</svg></div>`}
function legend(){return`<div class="legend"><span><i class="dot" style="background:${mid}"></i>Planejado</span><span><i class="dot" style="background:${blue}"></i>Realizado</span></div>`}
function bars(rows,type='money',ratio=false){if(!rows.length)return empty();let h=Math.max(210,rows.length*44+20),max=Math.max(1,...rows.flatMap(r=>ratio?[div(r.r,r.p)*100||0]:[r.p||0,r.r||0]));let s='';rows.forEach((r,i)=>{let y=12+i*(h-20)/rows.length,xx=205,w=330;let tip=`${r.name}: planejado ${fmt(r.p,r.type||type)}; realizado ${fmt(r.r,r.type||type)}; execução ${fmt(div(r.r,r.p),'pct')}`;s+=`<g ${hit(tip,{...r,type:r.type||type})}><text x="0" y="${y+16}">${esc(String(r.name).slice(0,27))}</text>`;if(ratio){let value=div(r.r,r.p);s+=`<rect x="${xx}" y="${y+3}" width="${Math.max(0,(value||0)*100/max*w)}" height="20" rx="3" fill="${value>1.1?yellow:blue}"/><text x="${xx+Math.max(0,(value||0)*100/max*w)+7}" y="${y+18}">${fmt(value,'pct')}</text>`}else{s+=`<rect x="${xx}" y="${y}" width="${Math.max(0,(r.p||0)/max*w)}" height="10" rx="2" fill="${mid}"/><rect x="${xx}" y="${y+13}" width="${Math.max(0,(r.r||0)/max*w)}" height="10" rx="2" fill="${blue}"/><text x="${xx+Math.max(0,(r.r||0)/max*w)+6}" y="${y+23}">${short(r.r||0)}</text>`}s+='</g>'});return svg(s,h)+(ratio?'':legend())}
function columns(rows,type='money'){let max=Math.max(1,...rows.flatMap(r=>[r.p||0,r.r||0])),w=520/Math.max(1,rows.length),s='';for(let j=0;j<4;j++){let y=185-j*50;s+=`<line x1="55" y1="${y}" x2="585" y2="${y}" stroke="#e3e9f2"/><text x="2" y="${y+4}">${short(max*j/3)}</text>`}rows.forEach((r,i)=>{let x=60+i*w;s+=`<g ${hit(`${r.name}: planejado ${fmt(r.p,r.type||type)}, realizado ${fmt(r.r,r.type||type)}`,{...r,type:r.type||type})}><rect x="${x+w*.13}" y="${185-(r.p||0)/max*150}" width="${w*.28}" height="${(r.p||0)/max*150}" fill="${mid}" rx="3"/><rect x="${x+w*.45}" y="${185-(r.r||0)/max*150}" width="${w*.28}" height="${(r.r||0)/max*150}" fill="${blue}" rx="3"/><text x="${x+w*.43}" y="210" text-anchor="middle">${esc(r.name.length>13?r.name.slice(0,12)+'…':r.name)}</text></g>`});return svg(s,230)+legend()}
function donut(rows,type='money'){rows=rows.filter(r=>r.r>0);let total=sum(rows,'r');if(!total)return empty();let offset=0,s='';rows.forEach((r,i)=>{let len=r.r/total*502.65;s+=`<circle ${hit(`${r.name}: ${fmt(r.r,r.type||type)} (${fmt(r.r/total,'pct')})`,{...r,type:r.type||type})} cx="160" cy="120" r="80" fill="none" stroke="${palette[i%6]}" stroke-width="28" stroke-dasharray="${len} ${502.65-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 160 120)"/><rect x="295" y="${35+i*34}" width="10" height="10" fill="${palette[i%6]}"/><text x="313" y="${44+i*34}">${esc(r.name.slice(0,28))}</text><text x="555" y="${44+i*34}" text-anchor="end">${fmt(r.r/total,'pct')}</text>`;offset+=len});s+=`<text x="160" y="117" text-anchor="middle" style="font-size:25px;fill:${blue};font-weight:700">${short(total)}</text><text x="160" y="141" text-anchor="middle">${type==='money'?'R$ realizados':'registros'}</text>`;return svg(s)}
function scatter(rows){rows=rows.filter(r=>r.ep||r.er||r.r);const maxX=Math.max(1,...rows.map(r=>r.er||0)),maxY=Math.max(1,...rows.map(r=>r.r||0));let s=`<line x1="70" y1="195" x2="575" y2="195" stroke="#ccd6e6"/><line x1="70" y1="20" x2="70" y2="195" stroke="#ccd6e6"/><text x="270" y="237">Despesa realizada (R$)</text><text x="8" y="16">Receita (R$)</text>`;for(let j=0;j<4;j++)s+=`<text x="${70+j*165}" y="213" text-anchor="middle">${short(maxX*j/3)}</text><text x="61" y="${195-j*55}" text-anchor="end">${short(maxY*j/3)}</text>`;rows.forEach((r,i)=>s+=`<circle ${hit(`${r.name} • Receita ${fmt(r.r,'money')} • Despesa ${fmt(r.er,'money')}`,r)} cx="${70+(r.er||0)/maxX*495}" cy="${195-(r.r||0)/maxY*165}" r="${8+Math.sqrt((r.peopleR||0)/Math.max(1,...rows.map(x=>x.peopleR||0)))*13}" fill="${palette[i%6]}" fill-opacity=".8" stroke="white" stroke-width="2"/>`);return svg(s,250)}
function variance(rows){let max=Math.max(1,...rows.map(r=>Math.abs((r.p||0)-(r.r||0))));let h=Math.max(230,rows.length*27+30),s='';rows.forEach((r,i)=>{let y=15+i*27,v=(r.p||0)-(r.r||0),w=Math.abs(v)/max*145;s+=`<g ${hit(`${r.name} • Saldo orçamentário: ${fmt(v,'money')}`,r)}><text x="0" y="${y+13}">${esc(r.name.slice(0,26))}</text><rect x="${v<0?390-w:390}" y="${y}" width="${w}" height="17" fill="${v<0?yellow:blue}" rx="2"/><text x="${v<0?390-w-5:390+w+5}" y="${y+13}" text-anchor="${v<0?'end':'start'}">${short(v)}</text></g>`});s+=`<line x1="390" y1="0" x2="390" y2="${h-15}" stroke="#a8b6cf"/>`;return svg(s,h)}
function empty(msg='Sem dados preenchidos para este recorte.'){return`<div class="empty"><strong>Sem informação disponível</strong>${esc(msg)}</div>`}
function table(headers,rows){return`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function tr(r,cells){let id=detail.push(r)-1;return`<tr data-detail="${id}" tabindex="0">${cells.map((c,i)=>`<td class="${i?'num':''}">${c}</td>`).join('')}</tr>`}
function managementTable(rows){return table(['Indicador','Planejado','Realizado','Execução¹'],rows.map(r=>tr(r,[esc(r.name),isnum(r.p)?fmt(r.p,r.type):esc(r.rawP||'Não informado'),isnum(r.r)?fmt(r.r,r.type):esc(r.rawR||'Não informado'),fmt(div(r.r,r.p),'pct')])))}
function overview(d){let rev=metric(d,'receitas servicos'),expense=metric(d,'corrente'),sub=metric(d,'subsidio'),att=metric(d,'atendimentos');let op=d.management.filter(r=>['atendimentos','atendimento gratuidade pcg','atendimentos tcbst + dep','cpf atendidos'].includes(norm(r.name)));let credit=sum(d.activities,'tcb'),people=sum(d.activities,'peopleR');return`<div class="kpis">${kpi('Receita de serviços',rev.r,'Planejado: '+fmt(rev.p,'money'),'money')}${kpi('Despesas correntes',expense.r,'Execução: '+fmt(div(expense.r,expense.p),'pct'),'money')}${kpi('Subsídio utilizado',sub.r,'Corrente + capital − receita','money')}${kpi('Atendimentos',att.r,'Planejado: '+fmt(att.p))}</div><div class="grid">${card('Execução dos indicadores','Realizado ÷ planejado · valores acumulados',bars(op,'number',true))}${card('Perfil das vagas ocupadas','Análise das Atividades · '+esc(sheet(d.raw,'Análise das Atividades')[2][9]),donut([{name:'TCBST + dependentes',r:credit},{name:'Demais vagas ocupadas',r:people-credit}],'number'))}${card('Orçamento financeiro','Gestão N4 · valores em reais',columns([rev,expense,metric(d,'capital')].map((r,i)=>({...r,name:['Receitas','Corrente','Capital'][i]}))))}${card('Receita × despesa por atividade','Tamanho dos pontos: vagas ocupadas · clique para detalhar',scatter(d.activities))}</div>`}
function management(d){let rows=d.management;return`<div class="kpis">${['gasto em pessoal','demissoes','nps','cpf atendidos'].map(key=>{let r=metric(d,key);return kpi(r.name,r.r,'Planejado: '+fmt(r.p,r.type),r.type)}).join('')}</div><div class="grid equal">${card('Gestão de produção','Indicadores aplicáveis · comparação de volumes',bars(rows.filter(r=>r.group==='Gestão de Produção'&&isnum(r.r)),'number'))}${card('Gestão interna','Execução relativa ao planejado · não representa nota de desempenho',bars(rows.filter(r=>norm(r.group)==='gestao interna'&&isnum(r.r)),'number',true))}</div><div class="notice"><b>Observação de CPF atendidos:</b> ${esc(metric(d,'cpf atendidos').why||'Não informada.')} Clique nos indicadores para consultar a justificativa e o plano de ação originais.</div>${managementTable(rows)}<p class="minor">¹ Execução = realizado ÷ planejado. Percentuais não são somados; a direção desejável depende do indicador. “NA” e “SBI COM ERRO” são preservados.</p>`}
function grouped(rows,field){let out=[];for(const r of rows){let g=out.find(x=>x.name===r[field]);if(!g){g={name:r[field],p:0,r:0,ep:0,er:0,peopleP:0,peopleR:0,tcb:0,uniqueP:0,uniqueR:0,type:'number'};out.push(g)}for(const key of ['p','r','ep','er','peopleP','peopleR','tcb','uniqueP','uniqueR'])g[key]+=r[key]||0}return out}
function activities(d){let rows=d.activities.filter(r=>(!activeProgram||r.program===activeProgram)&&(!activeActivity||r.name===activeActivity)),programs=grouped(rows,'program'),top=[...rows].sort((a,b)=>(b.r||0)-(a.r||0)).slice(0,10);return`<div class="section-head"><span class="minor">Filtre por programa e atividade para explorar os resultados.</span><div class="actions"><select id="program" aria-label="Programa"><option value="">Todos os programas</option>${[...new Set(d.activities.map(r=>r.program))].map(p=>`<option ${p===activeProgram?'selected':''}>${esc(p)}</option>`).join('')}</select><select id="activity" aria-label="Atividade"><option value="">Todas as atividades</option>${d.activities.filter(r=>!activeProgram||r.program===activeProgram).map(r=>`<option ${r.name===activeActivity?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div><div class="kpis">${kpi('Receita das atividades',sum(rows,'r'),'Fonte: Análise das Atividades','money')}${kpi('Despesa das atividades',sum(rows,'er'),'Inclui linhas sem programa informado','money')}${kpi('Vagas ocupadas',sum(rows,'peopleR'),'Vagas planejadas: '+fmt(sum(rows,'peopleP')))}${kpi('Ocupação das vagas',div(sum(rows,'peopleR'),sum(rows,'peopleP')),'Vagas ocupadas ÷ planejadas','pct')}</div><div class="grid equal">${card('Receitas por atividade • top 10','Planejado × realizado · maiores receitas realizadas',bars(top,'money'))}${card('Receita × despesa','Cada ponto representa um registro da aba de atividades',scatter(rows))}${card('Ocupação por programa','Vagas planejadas × ocupadas',bars(programs.filter(r=>r.peopleP||r.peopleR).map(r=>({...r,p:r.peopleP,r:r.peopleR,type:'number'})),'number'))}${card('Pessoas atendidas por programa','Soma dos registros de produção · não equivale a CPFs únicos',columns(programs.filter(r=>r.uniqueP||r.uniqueR).map(r=>({...r,p:r.uniqueP,r:r.uniqueR,type:'number'})),'number'))}</div>${table(['Atividade / programa','Produção planejada','Produção realizada','Pessoas atendidas','Custo por produção','Custo por pessoa'],rows.map(r=>tr(r,[`${esc(r.name)}<br><span class="minor">${esc(r.program)} · ${esc(r.variable||'Variável não informada')}</span>`,fmt(r.prodP),fmt(r.prodR),fmt(r.uniqueR),fmt(div(r.er,r.prodR),'money'),fmt(div(r.er,r.uniqueR),'money')])))}<div class="notice">Ocupação: ${esc(sheet(d.raw,'Análise das Atividades')[2][9])}. Vagas (colunas J–L), produção (P–Q) e pessoas atendidas (U–V) são medidas distintas. As somas por atividade podem incluir uma mesma pessoa em mais de uma atividade; para CPFs únicos, consulte Gestão N4.</div>`}

function expenses(d){let rows=d.expenses.filter(r=>!activePackage||r.name===activePackage),p=sum(rows,'p'),r=sum(rows,'r');let ranking=[...rows].sort((a,b)=>b.r-a.r);return`<div class="section-head"><span class="minor">Valores da aba Despesas · clique nos pacotes para consultar as ações.</span><select id="package"><option value="">Todos os pacotes</option>${d.expenses.map(r=>`<option ${r.name===activePackage?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="kpis">${kpi('Despesa realizada',r,'Soma dos pacotes','money')}${kpi('Orçamento previsto',p,'Soma dos pacotes','money')}${kpi('Saldo orçamentário',p-r,'Planejado − realizado','money')}${kpi('Execução',div(r,p),'Realizado ÷ planejado','pct')}</div><div class="grid equal">${card('Maior participação nas despesas','Até 10 pacotes · ordenação por valor realizado',bars(ranking.slice(0,10),'money'))}${card('Saldo por pacote','Azul: saldo disponível · amarelo: acima do orçamento',variance(rows))}</div>${table(['Pacote','Orçado','Realizado','Saldo','Execução'],rows.map(r=>tr(r,[esc(r.name),fmt(r.p,'money'),fmt(r.r,'money'),fmt(r.p-r.r,'money'),fmt(div(r.r,r.p),'pct')])))} `}
function credit(d){let data=d.credit.filter(r=>[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum));return`<div class="notice">Somente esta aba possui linhas mensais. Meses sem preenchimento não são tratados como zero.</div><div class="month-controls"><label>De<select id="monthStart">${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></label><label>Até<select id="monthEnd">${months.map((m,i)=>`<option value="${i}" ${i===11?'selected':''}>${m}</option>`).join('')}</select></label></div><div id="creditBody">${creditBody(data)}</div>`}
function lines(rows){if(!rows.length)return empty();const max=Math.max(1,...rows.flatMap(r=>[r.p||0,r.r||0])),first=Math.min(...rows.map(r=>r.month)),last=Math.max(...rows.map(r=>r.month)),x=r=>65+(r.month-first)/Math.max(1,last-first)*480,y=v=>190-(v||0)/max*150;let s='';for(let i=0;i<4;i++){let yy=190-i*50;s+=`<line x1="60" y1="${yy}" x2="570" y2="${yy}" stroke="#e3e9f2"/><text x="8" y="${yy+4}">${short(max*i/3)}</text>`}for(const key of ['p','r']){let path=rows.map((r,i)=>`${i&&r.month===rows[i-1].month+1?'L':'M'}${x(r)},${y(r[key])}`).join(' ');s+=`<path d="${path}" fill="none" stroke="${key==='p'?mid:blue}" stroke-width="3" ${key==='p'?'stroke-dasharray="6 4"':''}/>`;rows.forEach(r=>s+=`<circle ${hit(`${r.name}: meta ${fmt(r.p)}, realizado ${fmt(r.r)}`,r)} cx="${x(r)}" cy="${y(r[key])}" r="6" fill="${key==='p'?mid:yellow}" stroke="${key==='p'?'white':blue}" stroke-width="2"/>`)}rows.forEach(r=>s+=`<text x="${x(r)}" y="216" text-anchor="middle">${esc(r.name.slice(0,3))}</text>`);return svg(s,235)+legend()}
function creditBody(rows){if(!rows.length)return empty('A aba Credenciamento está sem lançamentos. Os gráficos aparecerão quando os campos forem preenchidos.');let categories=[{name:'TCBST + dependentes',p:sum(rows,'p'),r:sum(rows,'r')},{name:'Conveniados',p:sum(rows,'cp'),r:sum(rows,'cr')},{name:'Público em geral',p:sum(rows,'gp'),r:sum(rows,'gr')}];return`<div class="kpis">${kpi('Credenciamentos',sum(categories,'r'),'Soma dos meses selecionados')}${kpi('Meta',sum(categories,'p'),'Soma dos meses selecionados')}${kpi('Execução',div(sum(categories,'r'),sum(categories,'p')),'Realizado ÷ meta','pct')}${kpi('Participação TCBST',div(categories[0].r,sum(categories,'r')),'Sobre os credenciamentos','pct')}</div><div class="grid equal">${card('Evolução mensal do credenciamento','Meta × realizado · somente meses preenchidos',lines(rows.map(r=>({name:months[r.month],month:r.month,p:[r.p,r.cp,r.gp].reduce((a,b)=>a+(b||0),0),r:[r.r,r.cr,r.gr].reduce((a,b)=>a+(b||0),0),type:'number',obs:r.obs}))))}${card('Composição por público','Realizado no intervalo selecionado',donut(categories,'number'))}</div>${table(['Mês','TCBST + Dep','Conveniados','Público geral'],rows.map(r=>tr(r,[months[r.month],fmt(r.r),fmt(r.cr),fmt(r.gr)])))}`}
function plans(d){let rows=[...d.management,...d.expenses].filter(r=>r.why||r.action).filter(r=>norm(r.name+' '+r.why+' '+r.action).includes(norm(query)));return`<div class="section-head"><span class="minor">Textos originais do Excel · clique para abrir a leitura completa</span><input id="search" class="search" placeholder="Buscar indicador ou justificativa" value="${esc(query)}"></div>${table(['Indicador / pacote','Justificativa','Plano de ação'],rows.map(r=>tr(r,[esc(r.name),`<span style="white-space:normal;display:block;max-width:500px;text-align:left">${esc(String(r.why||'Não informado').slice(0,230))}${String(r.why||'').length>230?'…':''}</span>`,`<span style="white-space:normal;display:block;max-width:400px;text-align:left">${esc(String(r.action||'Não informado').slice(0,180))}${String(r.action||'').length>180?'…':''}</span>`])))}`}
function quality(d){let current=metric(d,'corrente'),rev=metric(d,'receitas servicos'),expenseDiff=current.r-sum(d.expenses,'r'),revDiff=rev.r-sum(d.activities,'r');return`<div class="grid equal">${card('Conciliação das fontes','Diferenças preservadas, sem ajuste automático',table(['Comparação','Diferença'],[`<tr><td>Gestão N4 corrente − soma dos pacotes</td><td>${fmt(expenseDiff,'money')}</td></tr>`,`<tr><td>Receitas Serviços − receitas das atividades</td><td>${fmt(revDiff,'money')}</td></tr>`,`<tr><td>Pessoal na Gestão N4 − Pessoal em Despesas</td><td>${fmt(metric(d,'gasto em pessoal').r-(d.expenses.find(r=>norm(r.name)==='pessoal')?.r??0),'money')}</td></tr>`,`<tr><td>Atendimentos Gestão N4 − produção das atividades</td><td>${fmt(metric(d,'atendimentos').r-sum(d.activities,'prodR'))}</td></tr>`])+'<p>As abas representam fontes distintas. O panorama usa Gestão N4; Atividades e Despesas usam seus respectivos registros.</p>')}${card('Cobertura da base','O que está efetivamente disponível',`<p>Unidade: <b>${esc(d.unit)}</b></p><p>Período: <b>${esc(d.period)} • ${esc(d.year)}</b></p><p>${d.activities.length} registros de atividades e custos · ${d.expenses.length} pacotes · ${d.management.length} indicadores.</p><p>Credenciamento: ${d.credit.filter(r=>[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum)).length} meses preenchidos.</p>`) }${card('Critérios de leitura','Regras para manter a atualização consistente',`<p>“Desvio %” na planilha é, em geral, realizado ÷ planejado. No painel, esse valor se chama <b>execução</b>. O saldo orçamentário é planejado − realizado.</p><p>Campos em branco, NA, traços e SBI COM ERRO não viram dados fictícios. Totais e percentuais do painel são recalculados a partir dos registros numéricos; linhas TOTAL GERAL são excluídas das somas.</p><p>O NPS realizado é exibido como informado na Gestão N4. A execução do NPS é recalculada como realizado ÷ planejado, pois a coluna Desvio pode repetir a nota realizada.</p><p>Os textos de justificativas são preservados integralmente, mesmo quando mencionam valores diferentes dos campos numéricos.</p><p>O arquivo possui fechamentos acumulados. Não é possível obter receita ou despesa de um mês isolado a partir desta base. Arquivos de períodos diferentes são selecionados individualmente para evitar dupla contagem.</p><p>O ano é identificado pelo nome do arquivo. Mantenha o ano no nome, por exemplo “N4 - 2026 - Unidade.xlsx”.</p>`,'full')}</div>`}
const tabs=['Visão geral','Gestão N4','Atividades','Despesas','Credenciamento','Planos de ação','Sobre os dados'];const renderers=[overview,management,activities,expenses,credit,plans,quality];
function render(){current=datasets.find(d=>d.key===$('#period').value)||datasets[0];detail=[];document.body.dataset.view=tab;$('#title').textContent=current.unit;$('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#main').innerHTML=`<div class="section-head"><h2>${tab}</h2><span class="pill">${esc(current.period)} · ${esc(current.year)}</span></div>`+renderers[tabs.indexOf(tab)](current);$('#source').textContent='Fonte: '+current.filename;$('#program')?.addEventListener('change',e=>{activeProgram=e.target.value;activeActivity='';render()});$('#activity')?.addEventListener('change',e=>{activeActivity=e.target.value;render()});$('#package')?.addEventListener('change',e=>{activePackage=e.target.value;render()});$('#search')?.addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});for(let id of ['#monthStart','#monthEnd'])$(id)?.addEventListener('change',()=>{let start=+$('#monthStart').value,end=+$('#monthEnd').value;$('#creditBody').innerHTML=start>end?empty('O mês inicial deve ser anterior ou igual ao mês final.'):creditBody(current.credit.filter(r=>r.month>=start&&r.month<=end&&[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum)))})}
function showDetail(r){let content=`<h2>${esc(r.name||months[r.month]||'Detalhamento')}</h2>`;if(r.program)content+=`<p>Programa: ${esc(r.program)}</p>`;if(isnum(r.p)||isnum(r.r))content+=`<p>Planejado: <b>${fmt(r.p,r.type||'money')}</b><br>Realizado: <b>${fmt(r.r,r.type||'money')}</b><br>Execução: <b>${fmt(div(r.r,r.p),'pct')}</b></p>`;if(r.program)content+=`<p>Despesa realizada: ${fmt(r.er,'money')}<br>Vagas ocupadas: ${fmt(r.peopleR)}<br>Vagas TCBST + dependentes: ${fmt(r.tcb)}<br>Pessoas atendidas (produção): ${fmt(r.uniqueR)}<br>Produção (${esc(r.variable)}): ${fmt(r.prodR)}</p>`;if(r.why)content+=`<h3>Justificativa</h3><p>${esc(r.why)}</p>`;if(r.action)content+=`<h3>Plano de ação</h3><p>${esc(r.action)}</p>`;if(r.obs)content+=`<h3>Observação</h3><p>${esc(r.obs)}</p>`;if(r.row)content+=`<div class="minor">Linha ${r.row} da aba de origem.</div>`;$('#modalContent').innerHTML=content;$('#modal').showModal()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render()}let t=e.target.closest('[data-id],[data-detail]');if(t)showDetail(detail[t.dataset.id??t.dataset.detail])});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id],[data-detail]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});document.addEventListener('pointermove',e=>{const t=e.target.closest('[data-tip]'),tip=$('#tooltip');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+14,innerHeight-tip.offsetHeight-10))+'px'}else tip.style.display='none'});
$('#unit').onchange=()=>{activeActivity=activePackage=activeProgram='';fillPeriods()};$('#period').onchange=()=>{activeActivity=activePackage=activeProgram='';render()};$('#reset').onclick=()=>{activeActivity=activePackage=activeProgram=query='';render()};$('#help').onclick=()=>{$('#modalContent').innerHTML=`<h2>Atualizar com a sua planilha</h2><p>1. Continue preenchendo o mesmo modelo Excel, mantendo os nomes das abas e as colunas.<br>2. Atualize o período em <b>Gestão N4!A1</b> e a unidade em <b>Panorama!F3</b>. Mantenha o ano no nome do arquivo.<br>3. Salve o Excel e clique em <b>Atualizar Excel</b>. Você pode selecionar mais de um arquivo.</p><p>Um arquivo da mesma unidade, ano e período substitui o fechamento anterior. Outras unidades ou períodos entram nos filtros. Os fechamentos não são somados entre si.</p><p>A importação é local e funciona sem internet em navegadores atuais. Os dados ficam salvos neste navegador quando o armazenamento está disponível. Para usar em outro computador, abra o HTML e importe a planilha atualizada novamente.</p><p>Credenciamento aceita filtro mensal porque tem linhas por mês. Os demais indicadores seguem o período acumulado descrito no Excel.</p>`;$('#modal').showModal()};
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),9000)}
// Leitor OOXML local: ZIP central directory + XML. Nenhuma dependência de rede.
async function readXlsx(buffer){const u=new Uint8Array(buffer),v=new DataView(buffer),decoder=new TextDecoder();let end=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('O arquivo não é um .xlsx válido.');let count=v.getUint16(end+10,true),pos=v.getUint32(end+16,true),entries={};for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('Estrutura ZIP inválida.');const method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true),nl=v.getUint16(pos+28,true),el=v.getUint16(pos+30,true),cl=v.getUint16(pos+32,true),off=v.getUint32(pos+42,true),name=decoder.decode(u.slice(pos+46,pos+46+nl));entries[name]={method,size,off};pos+=46+nl+el+cl}
async function xml(name){const e=entries[name];if(!e)return null;let start=e.off+30+v.getUint16(e.off+26,true)+v.getUint16(e.off+28,true),data=u.slice(start,start+e.size);if(e.method===8){try{data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch{throw Error('Não foi possível descompactar o Excel. Use uma versão atual do Chrome ou Edge.')}}else if(e.method!==0)throw Error('Compressão Excel não suportada.');let doc=new DOMParser().parseFromString(decoder.decode(data),'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('XML inválido no Excel.');return doc}
let workbook=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels'),strings=await xml('xl/sharedStrings.xml');if(!workbook||!rels)throw Error('Arquivo Excel inválido.');let ss=strings?Array.from(strings.getElementsByTagName('si'),e=>Array.from(e.getElementsByTagName('t'),t=>t.textContent).join('')):[],targets={};for(const e of rels.getElementsByTagName('Relationship'))targets[e.getAttribute('Id')]=e.getAttribute('Target');let out={};for(const sh of workbook.getElementsByTagName('sheet')){let target=targets[sh.getAttribute('r:id')];if(!target)continue;let path=target.startsWith('/')?target.slice(1):'xl/'+target;path=path.replace('xl/../','');let doc=await xml(path);if(!doc)continue;let rows=[];for(const cell of doc.getElementsByTagName('c')){const ref=cell.getAttribute('r'),match=ref?.match(/^([A-Z]+)(\d+)$/);if(!match)continue;let col=0;for(const l of match[1])col=col*26+l.charCodeAt(0)-64;let ri=+match[2]-1;rows[ri]??=[];let type=cell.getAttribute('t'),value=cell.getElementsByTagName('v')[0]?.textContent;if(type==='s')value=ss[+value];else if(type==='inlineStr')value=Array.from(cell.getElementsByTagName('t'),t=>t.textContent).join('');else if(type==='e')value=value||'Erro de fórmula';else if(value!==undefined&&value!==''&&type!=='str')value=Number(value);rows[ri][col-1]=value??null}out[sh.getAttribute('name')]=Array.from({length:rows.length},(_,i)=>rows[i]||[])}return out}
$('#upload').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let files=Array.from(e.target.files);if(!files.length)return;$('#upload').disabled=true;$('#upload').textContent='Lendo planilha…';try{let incoming=[];for(const file of files){if(!/\.xlsx$/i.test(file.name))throw Error('Selecione arquivos .xlsx.');if(file.size>30e6)throw Error('O arquivo excede o limite de 30 MB.');incoming.push(model(await readXlsx(await file.arrayBuffer()),file.name))}let next=[...datasets];for(const d of incoming){let i=next.findIndex(x=>x.key===d.key);if(i>=0)next[i]=d;else next.push(d)}datasets=next;let persisted=true;try{localStorage.setItem('sesc-araxa-unidade-v2',JSON.stringify(datasets.map(d=>({raw:d.raw,filename:d.filename}))))}catch{persisted=false}activeActivity=activePackage=activeProgram='';fillFilters();$('#unit').value=incoming.at(-1).unit;fillPeriods();$('#period').value=incoming.at(-1).key;render();toast(`${incoming.length} arquivo(s) atualizado(s). ${persisted?'Dados salvos neste navegador.':'Dados carregados nesta sessão; o navegador não permitiu salvar.'}`)}catch(err){toast('Não foi possível atualizar: '+err.message)}finally{$('#upload').disabled=false;$('#upload').textContent='↑ Atualizar Excel';e.target.value=''}};
fillFilters();
