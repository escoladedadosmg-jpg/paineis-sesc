ontas), chuveiros turbo, licitação do ar-condicionado VRF, telas e cortinas de ar , recreação integral, lembrete de NPS e reuniões semanais. Aguardando / Suspensas (3): Reforma do restaurante, capacitação Senac para cessionário e implantação do caixa flutuante (sistema limitado).🎯 3 Grandes Focos de EntregaQuartos e Conforto: Quartos renovados; modernização da climatização e acessibilidade avançando em blocos específicos.Operação A&B: Gestão do restaurante ajustada com reuniões e checklists diários; melhorias físicas estruturais no local entregam em Junho/26.Experiência (NPS): Atividades de lazer reforçadas e estímulo direto à pesquisa no check-out. Plano de ação detalhado no link e também na pasta: https://sescmg-my.sharepoint.com/:x:/g/personal/leidianyoliveira_sescmg_com_br/EWLQCPPUGsBLg_JaWR7v1SkBjV-ulysuJipohRZEnS-QeQ?e=GbKcS6 "], [null, null, null, null, null, null, null, null], ["Gestão Financeira ", "Execução Financeira - Corrente", null, 5194586, 4811564.39, 0.9262652288363307, "Sem discrepâncias- dentro da meta estabelecida pela instituição", "Sem necessidade de elaboração de plano de ação. Necessário acompanhamento sistemático dos números."], [null, "Execução Financeira - Capital ", null, 497511, 38085.09, 0.07655125213311866, "Trata-se dos itens planejados para todo ano de 2026 no hotel (R$ 955.014,00) :                                                   Sistema VRF de Ar Condicionado – Bloco TiradentesR$ 200.800,00                                         Troca de 110 frigobares das UH'sR$ 276.650,00                                                                            TVs para 105 UH's e demais espaços do HotelR$ 200.000,00                                                      Máquina de lavar louçasR$ 54.138,00                                                                                                 Demais equipamentos e mobiliáriosR$ 23.426,00", "A carteira de investimentos proposta está fortemente concentrada na modernização do Hotel Sesc Ar s (planejado) dentro da UO UNIDADE, sendo o correto dentro do Hotel (pois o evento de Réveillon é do Hotel).", null, null, null], [null, "Financeiro", 75558, 113555.97, -37997.97, 1.502898038592869, "O pacote Financeiro encerrou o período com realização de R$ 113.555,97, superando o orçamento em R$ 37.997,97 (+50,3%). O principal fator para o desvio foi o aumento das despesas com Comissão sobre Venda de Cartões, responsável por aproximadamente 86% do excesso registrado, refletindo maior volume de transações realizadas no Hotel (principalmente de cliente Walk-in) . Também contribuíram para o resultado os gastos não previstos com Indenizações e Restituições (R$ 4.820,00)- indenização em veículo de cliente danificado por telhas, além dos aumentos em Tarifas Bancárias e Taxas.", "Em acompanhamento, sem plano de ação.", null, null, null], [null, "Juridico", 0, 0, 0, "-", "Sem ajustes", "Sem ajustes", null, null, null], [null, "Manutenção", 809667, 767306.4, 42360.59999999998, 0.9476814542274787, "O pacote Manutenção apresentou realização de R$ 767.306,40 frente ao orçamento de R$ 809.667,00, encerrando o período com economia de R$ 42.360,60 (-5,2%).\n\nOs principais desvios positivos ocorreram em Material Hidráulico e Hidrossanitário (+74,8%), Material Elétrico (+49,0%), Material de Pintura (+24,7%) e Material Civil (+24,0%), indicando maior demanda por insumos destinados às manutenções corretivas, melhorias de infraestrutura e revitalizações realizadas na unidade ao longo do período.\n\nPor outro lado, o maior desvio negativo foi registrado em Serviços de Manutenção Predial (-10,8%), com economia de R$ 68.811,05, compensando os aumentos observados nos materiais de manutenção. Para com os Serviços de Manutenção Predial, cabe destacar que teremos a entrada dos serviços de demolição de jardineiras e camas/bicamas de alvenaria no bloco Ouro Preto, correspondente a R$ 70.000,00 (setembro/2026),e teremos também a aquisição de mais insumos como piso vinílico, materiais de pintura para a continuidade de retrofit no referido espaço. Cabe destacar também que teremos o rateio dos serviços de piso monolitico no parque infantil da Unidade/Hotel.", "Sem plano de ação.", null, null, null], [null, "Marketing / Comunicação", 23669, 78789.99, -55120.990000000005, 3.3288263128987285, "O pacote Comunicação e Marketing apresentou realização de R$ 78.789,99, frente ao orçamento de R$ 23.669,00, resultando em um desvio de R$ 55.120,99 (+232,9%). O principal responsável pelo resultado foi a rubrica Serviços de Publicidade/Mídia e Propaganda, que excedeu o orçamento em R$ 54.771,44 (+315,2%), representando praticamente a totalidade do desvio do pacote. As demais contas permaneceram próximas ao valor planejado, sem impacto relevante no resultado geral.Divulgações com influenciadores (PUBLICIDADE E PROPAGANDA LTDA FINPAG 162036 REF VEICULAÇÃO DE MÍDIA ONLINE \"INFLUENCIADORES\" COM A DIVULGAÇÃO DA CAMPANHA HOTÉIS SESC - 2º SEMESTRE) e  VEICULAÇÃO DE MÍDIA ONLINE \"GOOGLE CLIENTES - DISPLAY, SEARCH, YOUTUBE\" COM A DIVULGAÇÃO DE DIVERSAs.", "Em acompanhamento com o gestor do contrato.", null, null, null], [null, "Meio Ambiente", 89678, 51516.06, 38161.94, 0.5744559423715961, "O pacote Meio Ambiente apresentou realização de R$ 51.516,06 frente ao orçamento de R$ 89.678,00, resultando em uma economia de R$ 38.161,94 (-42,6%). O principal fator para o desempenho abaixo do previsto foi a menor execução das despesas com Controle de Praga (-62,5%) e Limpeza e Tratamento de Piscinas/Reservatórios (-20,3%), que juntas representam a maior parte da economia do pacote.\n\nTambém foi observado gasto inferior ao planejado em Produtos Químicos e Reagentes (-24,9%). Em contrapartida, houve registro de despesa em Programa de Sustentabilidade (Materiais) sem previsão orçamentária, no valor de R$ 221,42, porém sem impacto relevante no resultado gera. Cabe ressaltar que teremos a Limpeza dos Reservatórios em Outubro, teremos tambéma contratação de empresa especializada em capt (Robson) e uma camareira (Maria do Carmo).\n", "Realização de processos seletivos mais ágeis e melhoria na divulgação da vaga. Em realização de alinhamentos com a Analista de Atração e Seleção. Sem plano de ação dentro da variação 10% (+/-)", null, null, null], [null, "Portaria e Vigilancia", 119598, 114400.81, 5197.190000000002, 0.9565445074332346, "O rateio dos serviços de vigilância entre as UO'S Hotel e Unidade, ajustado em retificativo.", "Em acompanhamento.Sem plano de ação dentro da variação 10% (+/-)", null, null, null], [null, "Programas", 1952459, 1856534.75, 95924.25, 0.9508700310736359, "O pacote Programas apresentou realização de R$ 1.856.534,75, correspondendo a 95,1% do orçamento previsto, com economia global de R$ 95.924,25 (-4,9%).\n\nOs principais desvios negativos ocorreram em Artigos de Enxoval para Hospedagens (-48,2%), com economia de R$ 153.964,00, one temos a previsão de entrega dos enxovais para o mês de Outubro (incluindo também toalhas de piscina) e em Artigos de Conveniência para Hospedagem (-33,2%) onde cabe ressaltar que nas duas ultimas rotas não obtivemos envio de sabonetes, indicando menor aquisição de materiais previstos para operação e reposição de estoque. Houve ainda execução abaixo do planejado em Guias de Turismo (-19,2%).\n\nPor outro lado, destacam-se os desvios positivos em Gêneros Alimentícios (+45,0%), com acréscimo de R$ 8.681,75, e em Transporte de Passageiros - Turismo (+39,6%), com realização superior ao orçamento em R$ 10.183,00. O maior impacto financeiro em valor absoluto ocorreu em Lanches e Refeições (Materiais), que ultrapassou o orçamento em R$ 77.090,88 (+6,5%), refletindo aumento de consumo associado ao volume de atendimento e execução das atividades programadas.", "Grupo de pagamento que impactou o pacote Programas- Artigos de Enxovais R$ 159.774,00 (2ª remesssa em outubro / 2026). Em acompanhamento.Sem plano de ação dentro da variação 10% (+/-)", null, null, null], [null, "TI", 137318, 132522.48, 4795.5199999999895, 0.9650772659083297, "TI apresentou realização de 90,3% do orçamento (R$ 110,3 mil), com maior concentração das despesas em Telefonia, Comunicação e Dados e Infraestrutura e Segurança de TI, enquanto os investimentos previstos para Equipamentos de Informática não registraram execução no período.", "1) Acompanhamento de execução orçamentária junto a área demandante e responsável pelo pacote. ", null, null, null], [null, "Veiculos", 2668, 4560.29, -1892.29, 1.7092541229385307, "A realização de 171,% do orçamento (R$ 1.892,29 mil) reflete a apropriação das despesas de veículos conforme os critérios de rateio adotados entre as Unidades Operacionais, sendo impactada principalmente pelas despesas de locação de veículos .", "Em acompanhamento.", null, null, null], [null, "Viagens", 7111, 1867.82, 5243.18, 0.2626662916608072, "Viagens apresentou realização de 74% do orçamento (R$ 5.243,18mil), refletindo menor utilização de recursos destinados a hospedagens, passagens e deslocamentos durante o período, além de estorno registrado na conta de transporte, fretamento e transfer. Cabe ressaltar que teremos a apropriação dedespesas de viagens no mês de setembro da equipe para o treinamento realizado em Poços de Caldas (Coordenação,Governanta e Supervior de Recepção) e da Equipotel (Coordenação), em setembro/26.", "Viagens da equipe realizadas em setembro /2026 para Poços de Caldas (Coordenador/Supervisor de Recepção e Governanta) e para a Equipotel (Cooordenador).", null, null, null], [null, null, null, null, 0, "-", null, null, null, null, null], [null, "TOTAL GERAL", 5194586, 4811383.840000001, 383202.1599999999, 0.9262304714947449, null, null, null, null, null], [null, null, null, null, null, null, null, null, null, null, null], [null, "Até 89% Amarelo - de 90% a 110% Verde -  acima de 110% vermelho", null, null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null 'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(), isnum=x=>typeof x==='number'&&Number.isFinite(x), n=x=>isnum(x)?x:null, sum=(a,k)=>a.some(r=>isnum(r[k]))?a.reduce((t,r)=>t+(n(r[k])??0),0):null, div=(a,b)=>isnum(a)&&isnum(b)&&b!==0?a/b:null;
const fmt=(x,type='number')=>!isnum(x)?'Não informado':type==='money'?x.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):type==='pct'?(100*x).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':x.toLocaleString('pt-BR',{maximumFractionDigits:2}), short=x=>Math.abs(x)>=1e6?(x/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi':Math.abs(x)>=1e3?(x/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':fmt(x);
const months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];const blue='#062363',yellow='#f6bb00',mid='#6d81bd',palette=[blue,yellow,mid,'#387cbe','#abc4e5','#c88e00'];
let tab='Visão geral', detail=[],activeActivity='',activePackage='',query='';
function sheet(raw,name){let key=Object.keys(raw).find(k=>norm(k)===norm(name));if(!key)throw Error('Aba obrigatória ausente: '+name);return raw[key]}
function model(raw,filename){const g=sheet(raw,'Gestão N4'),a=sheet(raw,'Análise das Atividades'),d=sheet(raw,'Despesas'),c=sheet(raw,'Credenciamento'),p=sheet(raw,'Panorama');sheet(raw,'Orientações Gestão N4');
if(norm(g[1]?.[3])!=='planejado'||norm(a[3]?.[2])!=='orcado'||norm(d[2]?.[2])!=='orcado')throw Error('Cabeçalhos diferentes do modelo N4. Mantenha as colunas originais.');
const unit=String(p[2]?.[5]||'').trim();if(!unit)throw Error('Informe a unidade na célula F3 da aba Panorama.');
const period=String(g[0]?.[0]||'').replace(/^per[ií]odo\s*:\s*/i,'').trim();if(!period)throw Error('Informe o período na célula A1 da aba Gestão N4.');const year=filename.match(/20\d{2}/)?.[0];if(!year)throw Error('Inclua o ano no nome do arquivo, por exemplo N4 - 2026 - Hotel.xlsx.');let group='';let management=[];
g.forEach((r,i)=>{if(r[0]&&/gestao/.test(norm(r[0])))group=String(r[0]).trim();if(r[1]&&norm(r[1])!=='indicadores'){const name=String(r[1]).trim();management.push({name,p:n(r[3]),r:n(r[4]),rawP:r[3],rawR:r[4],why:r[6],action:r[7],group,row:i+1,type:/^r\$|execu/.test(norm(name))?'money':/^%|nps/.test(norm(name))?'pct':'number'})}});
// O subsídio segue a fórmula explícita da planilha, sem depender de cache de fórmulas.
const get=t=>management.find(x=>norm(x.name).includes(t));const current=get('corrente'),capital=get('capital'),revenue=get('receitas servicos'),subsidy=get('subsidio');if(current&&capital&&revenue&&subsidy){for(const k of ['p','r'])if([current[k],capital[k],revenue[k]].every(isnum))subsidy[k]=current[k]+capital[k]-revenue[k]}
const activities=a.slice(4).map((r,i)=>({name:r[1],program:r[0],p:n(r[2]),r:n(r[3]),ep:n(r[5]),er:n(r[6]),peopleP:n(r[9]),peopleR:n(r[10]),tcb:n(r[11]),variable:r[14],prodP:n(r[15]),prodR:n(r[16]),uniqueP:n(r[20]),uniqueR:n(r[21]),row:i+5})).filter(r=>r.name&&norm(r.name)!=='total geral'&&r.program);
const expenses=d.slice(3).map((r,i)=>({name:r[1],p:n(r[2]),r:n(r[3]),why:r[6],action:r[7],row:i+4,type:'money'})).filter(r=>r.name&&norm(r.name)!=='total geral'&&(isnum(r.p)||isnum(r.r)));
const credit=c.map((r,i)=>({month:months.findIndex(m=>norm(m)===norm(r[0])),p:n(r[1]),r:n(r[2]),cp:n(r[4]),cr:n(r[5]),gp:n(r[7]),gr:n(r[8]),obs:r[14],row:i+1})).filter(r=>r.month>=0);if(!management.length||!activities.length||!expenses.length)throw Error('Não foi possível identificar os registros do modelo.');return{raw,unit,period,year,filename,management,activities,expenses,credit,key:[norm(unit),year,norm(period)].join('|')};}
let datasets=[model(JSON.parse($('#initial').textContent),'N4 - 2026-Sesc Araxá - Hotel(2).xlsx')];let current;
try{const saved=JSON.parse(localStorage.getItem('sesc-n4-v1')||'null');if(saved?.length)datasets=saved.map(x=>model(x.raw,x.filename))}catch{}
function fillFilters(){const selected=$('#unit').value;$('#unit').innerHTML=[...new Set(datasets.map(d=>d.unit))].map(u=>`<option>${esc(u)}</option>`).join('');if([...$('#unit').options].some(o=>o.value===selected))$('#unit').value=selected;fillPeriods()}
function fillPeriods(){const selected=$('#period').value;$('#period').innerHTML=datasets.filter(d=>d.unit===$('#unit').value).map(d=>`<option value="${esc(d.key)}">${esc(d.period)} • ${esc(d.year)}</option>`).join('');if([...$('#period').options].some(o=>o.value===selected))$('#period').value=selected;render()}
function metric(d,name){return d.management.find(r=>norm(r.name).includes(name))||{p:null,r:null,name}}
function kpi(label,value,sub,type='number'){return`<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${fmt(value,type)}</div><div class="sub">${esc(sub)}</div></div>`}
function card(title,sub,content,cl=''){return`<section class="card ${cl}"><h3>${title}</h3><div class="sub">${sub}</div>${content}</section>`}
function hit(text,obj){let id=detail.push(obj)-1;return`class="hit" tabindex="0" role="button" data-id="${id}" data-tip="${esc(text)}" aria-label="${esc(text)}"`}
function svg(content,h=240){return`<svg class="chart" viewBox="0 0 600 ${h}" role="img">${content}</svg>`}
function legend(){return`<div class="legend"><span><i class="dot" style="background:${mid}"></i>Planejado</span><span><i class="dot" style="background:${blue}"></i>Realizado</span></div>`}
function bars(rows,type='money',ratio=false){if(!rows.length)return empty();let h=Math.max(210,rows.length*44+20),max=Math.max(1,...rows.flatMap(r=>ratio?[div(r.r,r.p)*100||0]:[r.p||0,r.r||0]));let s='';rows.forEach((r,i)=>{let y=12+i*(h-20)/rows.length,xx=205,w=330;let tip=`${r.name}: planejado ${fmt(r.p,r.type||type)}; realizado ${fmt(r.r,r.type||type)}; execução ${fmt(div(r.r,r.p),'pct')}`;s+=`<g ${hit(tip,{...r,type:r.type||type})}><text x="0" y="${y+16}">${esc(String(r.name).slice(0,27))}</text>`;if(ratio){let value=div(r.r,r.p);s+=`<rect x="${xx}" y="${y+3}" width="${Math.max(0,(value||0)*100/max*w)}" height="20" rx="3" fill="${value>1.1?yellow:blue}"/><text x="${xx+Math.max(0,(value||0)*100/max*w)+7}" y="${y+18}">${fmt(value,'pct')}</text>`}else{s+=`<rect x="${xx}" y="${y}" width="${Math.max(0,(r.p||0)/max*w)}" height="10" rx="2" fill="${mid}"/><rect x="${xx}" y="${y+13}" width="${Math.max(0,(r.r||0)/max*w)}" height="10" rx="2" fill="${blue}"/><text x="${xx+Math.max(0,(r.r||0)/max*w)+6}" y="${y+23}">${short(r.r||0)}</text>`}s+='</g>'});return svg(s,h)+(ratio?'':legend())}
function columns(rows,type='money'){let max=Math.max(1,...rows.flatMap(r=>[r.p||0,r.r||0])),w=520/Math.max(1,rows.length),s='';for(let j=0;j<4;j++){let y=185-j*50;s+=`<line x1="55" y1="${y}" x2="585" y2="${y}" stroke="#e3e9f2"/><text x="2" y="${y+4}">${short(max*j/3)}</text>`}rows.forEach((r,i)=>{let x=60+i*w;s+=`<g ${hit(`${r.name}: planejado ${fmt(r.p,r.type||type)}, realizado ${fmt(r.r,r.type||type)}`,{...r,type:r.type||type})}><rect x="${x+w*.13}" y="${185-(r.p||0)/max*150}" width="${w*.28}" height="${(r.p||0)/max*150}" fill="${mid}" rx="3"/><rect x="${x+w*.45}" y="${185-(r.r||0)/max*150}" width="${w*.28}" height="${(r.r||0)/max*150}" fill="${blue}" rx="3"/><text x="${x+w*.43}" y="210" text-anchor="middle">${esc(r.name.slice(0,19))}</text></g>`});return svg(s,230)+legend()}
function donut(rows,type='money'){rows=rows.filter(r=>r.r>0);let total=sum(rows,'r');if(!total)return empty();let offset=0,s='';rows.forEach((r,i)=>{let len=r.r/total*502.65;s+=`<circle ${hit(`${r.name}: ${fmt(r.r,r.type||type)} (${fmt(r.r/total,'pct')})`,{...r,type:r.type||type})} cx="160" cy="120" r="80" fill="none" stroke="${palette[i%6]}" stroke-width="28" stroke-dasharray="${len} ${502.65-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 160 120)"/><rect x="295" y="${35+i*34}" width="10" height="10" fill="${palette[i%6]}"/><text x="313" y="${44+i*34}">${esc(r.name.slice(0,28))}</text><text x="555" y="${44+i*34}" text-anchor="end">${fmt(r.r/total,'pct')}</text>`;offset+=len});s+=`<text x="160" y="117" text-anchor="middle" style="font-size:25px;fill:${blue};font-weight:700">${short(total)}</text><text x="160" y="141" text-anchor="middle">${type==='money'?'R$ realizados':'pessoas'}</text>`;return svg(s)}
function scatter(rows){rows=rows.filter(r=>r.ep||r.er||r.r);const maxX=Math.max(1,...rows.map(r=>r.er||0)),maxY=Math.max(1,...rows.map(r=>r.r||0));let s=`<line x1="70" y1="195" x2="575" y2="195" stroke="#ccd6e6"/><line x1="70" y1="20" x2="70" y2="195" stroke="#ccd6e6"/><text x="270" y="237">Despesa realizada (R$)</text><text x="8" y="16">Receita (R$)</text>`;for(let j=0;j<4;j++)s+=`<text x="${70+j*165}" y="213" text-anchor="middle">${short(maxX*j/3)}</text><text x="61" y="${195-j*55}" text-anchor="end">${short(maxY*j/3)}</text>`;rows.forEach((r,i)=>s+=`<circle ${hit(`${r.name} • Receita ${fmt(r.r,'money')} • Despesa ${fmt(r.er,'money')}`,r)} cx="${70+(r.er||0)/maxX*495}" cy="${195-(r.r||0)/maxY*165}" r="${8+Math.sqrt((r.peopleR||0)/11027)*13}" fill="${palette[i%6]}" fill-opacity=".8" stroke="white" stroke-width="2"/>`);return svg(s,250)}
function variance(rows){let max=Math.max(1,...rows.map(r=>Math.abs((r.p||0)-(r.r||0))));let h=Math.max(230,rows.length*27+30),s='';rows.forEach((r,i)=>{let y=15+i*27,v=(r.p||0)-(r.r||0),w=Math.abs(v)/max*145;s+=`<g ${hit(`${r.name} • Saldo orçamentário: ${fmt(v,'money')}`,r)}><text x="0" y="${y+13}">${esc(r.name.slice(0,26))}</text><rect x="${v<0?390-w:390}" y="${y}" width="${w}" height="17" fill="${v<0?yellow:blue}" rx="2"/><text x="${v<0?390-w-5:390+w+5}" y="${y+13}" text-anchor="${v<0?'end':'start'}">${short(v)}</text></g>`});s+=`<line x1="390" y1="0" x2="390" y2="${h-15}" stroke="#a8b6cf"/>`;return svg(s,h)}
function empty(msg='Sem dados preenchidos para este recorte.'){return`<div class="empty"><strong>Sem informação disponível</strong>${esc(msg)}</div>`}
function table(headers,rows){return`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function tr(r,cells){let id=detail.push(r)-1;return`<tr data-detail="${id}" tabindex="0">${cells.map((c,i)=>`<td class="${i?'num':''}">${c}</td>`).join('')}</tr>`}
function managementTable(rows){return table(['Indicador','Planejado','Realizado','Execução¹'],rows.map(r=>tr(r,[esc(r.name),isnum(r.p)?fmt(r.p,r.type):esc(r.rawP||'Não informado'),isnum(r.r)?fmt(r.r,r.type):esc(r.rawR||'Não informado'),fmt(div(r.r,r.p),'pct')])))}
function overview(d){let rev=metric(d,'receitas servicos'),expense=metric(d,'corrente'),sub=metric(d,'subsidio'),att=metric(d,'atendimentos');let op=d.management.filter(r=>r.group==='Gestão de Produção'&&isnum(r.r));let credit=sum(d.activities,'tcb'),people=sum(d.activities,'peopleR');return`<div class="kpis">${kpi('Receita de serviços',rev.r,'Planejado: '+fmt(rev.p,'money'),'money')}${kpi('Despesas correntes',expense.r,'Execução: '+fmt(div(expense.r,expense.p),'pct'),'money')}${kpi('Subsídio utilizado',sub.r,'Corrente + capital − receita','money')}${kpi('Atendimentos',att.r,'Planejado: '+fmt(att.p))}</div><div class="grid">${card('Execução dos indicadores','Realizado ÷ planejado · valores acumulados',bars(op,'number',true))}${card('Perfil das pessoas atendidas','Análise das Atividades · soma dos registros',donut([{name:'TCBST + dependentes',r:credit},{name:'Demais pessoas atendidas',r:people-credit}],'number'))}${card('Orçamento financeiro','Gestão N4 · valores em reais',columns([rev,expense,metric(d,'capital')].map((r,i)=>({...r,name:['Receitas','Corrente','Capital'][i]}))))}${card('Receita × despesa por atividade','Tamanho dos pontos: pessoas atendidas · clique para detalhar',scatter(d.activities))}</div>`}
function management(d){let rows=d.management;return`<div class="kpis">${['gasto em pessoal','demissoes','nps','cpf atendidos'].map(key=>{let r=metric(d,key);return kpi(r.name,r.r,'Planejado: '+fmt(r.p,r.type),r.type)}).join('')}</div><div class="grid equal">${card('Gestão de produção','Indicadores aplicáveis · comparação de volumes',bars(rows.filter(r=>r.group==='Gestão de Produção'&&isnum(r.r)),'number'))}${card('Gestão interna','Execução relativa ao planejado · não representa nota de desempenho',bars(rows.filter(r=>norm(r.group)==='gestao interna'&&isnum(r.r)),'number',true))}</div><div class="notice"><b>Observação de CPF atendidos:</b> ${esc(metric(d,'cpf atendidos').why||'Não informada.')} Clique nos indicadores para consultar a justificativa e o plano de ação originais.</div>${managementTable(rows)}<p class="minor">¹ Execução = realizado ÷ planejado. Percentuais não são somados; a direção desejável depende do indicador. “NA” e “SBI COM ERRO” são preservados.</p>`}
function activities(d){let rows=d.activities.filter(r=>!activeActivity||r.name===activeActivity);return`<div class="section-head"><span class="minor">Selecione uma atividade para filtrar esta aba.</span><select id="activity"><option value="">Todas as atividades</option>${d.activities.map(r=>`<option ${r.name===activeActivity?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="kpis">${kpi('Receita das atividades',sum(rows,'r'),'Fonte: Análise das Atividades','money')}${kpi('Despesa das atividades',sum(rows,'er'),'Fonte: Análise das Atividades','money')}${kpi('Pessoas atendidas',sum(rows,'peopleR'),'Planejado: '+fmt(sum(rows,'peopleP')))}${kpi('Ocupação¹',div(sum(rows,'peopleR'),sum(rows,'peopleP')),'Realizado ÷ planejado','pct')}</div><div class="grid equal">${card('Receitas por atividade','Planejado × realizado',bars(rows,'money'))}${card('Receita × despesa','Passe o mouse para identificar cada atividade',scatter(rows))}${card('Pessoas atendidas','Volumes previstos e realizados',columns(rows.filter(r=>r.peopleP||r.peopleR).map(r=>({...r,p:r.peopleP,r:r.peopleR})),'number'))}${card('Produção por atividade','Unidade de medida preservada em cada registro',table(['Atividade / variável','Planejado','Realizado','Execução'],rows.filter(r=>isnum(r.prodP)||isnum(r.prodR)).map(r=>tr(r,[`${esc(r.name)}<br><span class="minor">${esc(r.variable)}</span>`,fmt(r.prodP),fmt(r.prodR),fmt(div(r.prodR,r.prodP),'pct')]))))}</div>${table(['Atividade','Receita','Despesa','Custo por presença/diária','Custo por pessoa'],rows.map(r=>tr(r,[esc(r.name),fmt(r.r,'money'),fmt(r.er,'money'),fmt(div(r.er,r.prodR),'money'),fmt(div(r.er,r.uniqueR),'money')])))}<p class="minor">¹ A seção de ocupação é rotulada “${esc(d.raw[Object.keys(d.raw).find(k=>norm(k)==='analise das atividades')][2][9])}” no Excel. O cálculo corresponde a pessoas realizadas ÷ planejadas, não a quartos ocupados. Diárias e presenças não são somadas em um único indicador.</p>`}
function expenses(d){let rows=d.expenses.filter(r=>!activePackage||r.name===activePackage),p=sum(rows,'p'),r=sum(rows,'r');let ranking=[...rows].sort((a,b)=>b.r-a.r);return`<div class="section-head"><span class="minor">Valores da aba Despesas · clique nos pacotes para consultar as ações.</span><select id="package"><option value="">Todos os pacotes</option>${d.expenses.map(r=>`<option ${r.name===activePackage?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="kpis">${kpi('Despesa realizada',r,'Soma dos pacotes','money')}${kpi('Orçamento previsto',p,'Soma dos pacotes','money')}${kpi('Saldo orçamentário',p-r,'Planejado − realizado','money')}${kpi('Execução',div(r,p),'Realizado ÷ planejado','pct')}</div><div class="grid equal">${card('Maior participação nas despesas','Até 10 pacotes · ordenação por valor realizado',bars(ranking.slice(0,10),'money'))}${card('Saldo por pacote','Azul: saldo disponível · amarelo: acima do orçamento',variance(rows))}</div>${table(['Pacote','Orçado','Realizado','Saldo','Execução'],rows.map(r=>tr(r,[esc(r.name),fmt(r.p,'money'),fmt(r.r,'money'),fmt(r.p-r.r,'money'),fmt(div(r.r,r.p),'pct')])))} `}
function credit(d){let data=d.credit.filter(r=>[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum));return`<div class="notice">Somente esta aba possui linhas mensais. Meses sem preenchimento não são tratados como zero.</div><div class="month-controls"><label>De<select id="monthStart">${months.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></label><label>Até<select id="monthEnd">${months.map((m,i)=>`<option value="${i}" ${i===11?'selected':''}>${m}</option>`).join('')}</select></label></div><div id="creditBody">${creditBody(data)}</div>`}
function creditBody(rows){if(!rows.length)return empty('A aba Credenciamento está sem lançamentos. Os gráficos aparecerão quando os campos forem preenchidos.');let categories=[{name:'TCBST + dependentes',p:sum(rows,'p'),r:sum(rows,'r')},{name:'Conveniados',p:sum(rows,'cp'),r:sum(rows,'cr')},{name:'Público em geral',p:sum(rows,'gp'),r:sum(rows,'gr')}];return`<div class="kpis">${kpi('Credenciamentos',sum(categories,'r'),'Soma dos meses selecionados')}${kpi('Meta',sum(categories,'p'),'Soma dos meses selecionados')}${kpi('Execução',div(sum(categories,'r'),sum(categories,'p')),'Realizado ÷ meta','pct')}${kpi('Participação TCBST',div(categories[0].r,sum(categories,'r')),'Sobre os credenciamentos','pct')}</div><div class="grid equal">${card('Credenciamento por mês','Meta × realizado',columns(rows.map(r=>({name:months[r.month],p:[r.p,r.cp,r.gp].reduce((a,b)=>a+(b||0),0),r:[r.r,r.cr,r.gr].reduce((a,b)=>a+(b||0),0)})),'number'))}${card('Composição por público','Realizado no intervalo selecionado',donut(categories,'number'))}</div>${table(['Mês','TCBST + Dep','Conveniados','Público geral'],rows.map(r=>tr(r,[months[r.month],fmt(r.r),fmt(r.cr),fmt(r.gr)])))}`}
function plans(d){let rows=[...d.management,...d.expenses].filter(r=>r.why||r.action).filter(r=>norm(r.name+' '+r.why+' '+r.action).includes(norm(query)));return`<div class="section-head"><span class="minor">Textos originais do Excel · clique para abrir a leitura completa</span><input id="search" class="search" placeholder="Buscar indicador ou justificativa" value="${esc(query)}"></div>${table(['Indicador / pacote','Justificativa','Plano de ação'],rows.map(r=>tr(r,[esc(r.name),`<span style="white-space:normal;display:block;max-width:500px;text-align:left">${esc(String(r.why||'Não informado').slice(0,230))}${String(r.why||'').length>230?'…':''}</span>`,`<span style="white-space:normal;display:block;max-width:400px;text-align:left">${esc(String(r.action||'Não informado').slice(0,180))}${String(r.action||'').length>180?'…':''}</span>`])))}`}
function quality(d){let current=metric(d,'corrente'),rev=metric(d,'receitas servicos'),expenseDiff=current.r-sum(d.expenses,'r'),revDiff=rev.r-sum(d.activities,'r');return`<div class="grid equal">${card('Conciliação das fontes','Diferenças preservadas, sem ajuste automático',table(['Comparação','Diferença'],[`<tr><td>Gestão N4 corrente − soma dos pacotes</td><td>${fmt(expenseDiff,'money')}</td></tr>`,`<tr><td>Receitas Serviços − receitas das atividades</td><td>${fmt(revDiff,'money')}</td></tr>`])+'<p>As abas representam fontes distintas. O panorama usa Gestão N4; Atividades e Despesas usam seus respectivos registros.</p>')}${card('Cobertura da base','O que está efetivamente disponível',`<p>Unidade: <b>${esc(d.unit)}</b></p><p>Período: <b>${esc(d.period)} • ${esc(d.year)}</b></p><p>${d.activities.length} atividades · ${d.expenses.length} pacotes · ${d.management.length} indicadores.</p><p>Credenciamento: ${d.credit.filter(r=>[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum)).length} meses preenchidos.</p>`) }${card('Critérios de leitura','Regras para manter a atualização consistente',`<p>“Desvio %” na planilha é, em geral, realizado ÷ planejado. No painel, esse valor se chama <b>execução</b>. O saldo orçamentário é planejado − realizado.</p><p>Campos em branco, NA, traços e SBI COM ERRO não viram dados fictícios. Totais e percentuais do painel são recalculados a partir dos registros numéricos; linhas TOTAL GERAL são excluídas das somas.</p><p>O arquivo possui fechamentos acumulados. Não é possível obter receita ou despesa de um mês isolado a partir desta base. Arquivos de períodos diferentes são selecionados individualmente para evitar dupla contagem.</p><p>O ano é identificado pelo nome do arquivo. Mantenha o ano no nome, por exemplo “N4 - 2026 - Unidade.xlsx”.</p>`,'full')}</div>`}
const tabs=['Visão geral','Gestão N4','Atividades','Despesas','Credenciamento','Planos de ação','Sobre os dados'];const renderers=[overview,management,activities,expenses,credit,plans,quality];
function render(){current=datasets.find(d=>d.key===$('#period').value)||datasets[0];detail=[];document.body.dataset.view=tab;$('#title').textContent=current.unit;$('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#main').innerHTML=`<div class="section-head"><h2>${tab}</h2><span class="pill">${esc(current.period)} · ${esc(current.year)}</span></div>`+renderers[tabs.indexOf(tab)](current);$('#source').textContent='Fonte: '+current.filename;$('#activity')?.addEventListener('change',e=>{activeActivity=e.target.value;render()});$('#package')?.addEventListener('change',e=>{activePackage=e.target.value;render()});$('#search')?.addEventListener('input',e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});for(let id of ['#monthStart','#monthEnd'])$(id)?.addEventListener('change',()=>{let start=+$('#monthStart').value,end=+$('#monthEnd').value;$('#creditBody').innerHTML=start>end?empty('O mês inicial deve ser anterior ou igual ao mês final.'):creditBody(current.credit.filter(r=>r.month>=start&&r.month<=end&&[r.p,r.r,r.cp,r.cr,r.gp,r.gr].some(isnum)))})}
function showDetail(r){let content=`<h2>${esc(r.name||months[r.month]||'Detalhamento')}</h2>`;if(r.program)content+=`<p>Programa: ${esc(r.program)}</p>`;if(isnum(r.p)||isnum(r.r))content+=`<p>Planejado: <b>${fmt(r.p,r.type||'money')}</b><br>Realizado: <b>${fmt(r.r,r.type||'money')}</b><br>Execução: <b>${fmt(div(r.r,r.p),'pct')}</b></p>`;if(r.program)content+=`<p>Despesa realizada: ${fmt(r.er,'money')}<br>Pessoas atendidas: ${fmt(r.peopleR)}<br>TCBST + dependentes: ${fmt(r.tcb)}<br>Produção (${esc(r.variable)}): ${fmt(r.prodR)}</p>`;if(r.why)content+=`<h3>Justificativa</h3><p>${esc(r.why)}</p>`;if(r.action)content+=`<h3>Plano de ação</h3><p>${esc(r.action)}</p>`;if(r.row)content+=`<div class="minor">Linha ${r.row} da aba de origem.</div>`;$('#modalContent').innerHTML=content;$('#modal').showModal()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render()}let t=e.target.closest('[data-id],[data-detail]');if(t)showDetail(detail[t.dataset.id??t.dataset.detail])});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id],[data-detail]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});document.addEventListener('pointermove',e=>{const t=e.target.closest('[data-tip]'),tip=$('#tooltip');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+14,innerHeight-tip.offsetHeight-10))+'px'}else tip.style.display='none'});
$('#unit').onchange=()=>{activeActivity=activePackage='';fillPeriods()};$('#period').onchange=()=>{activeActivity=activePackage='';render()};$('#reset').onclick=()=>{activeActivity=activePackage=query='';render()};$('#help').onclick=()=>{$('#modalContent').innerHTML=`<h2>Atualizar com a sua planilha</h2><p>1. Continue preenchendo o mesmo modelo Excel, mantendo os nomes das abas e as colunas.<br>2. Atualize o período em <b>Gestão N4!A1</b> e a unidade em <b>Panorama!F3</b>. Mantenha o ano no nome do arquivo.<br>3. Salve o Excel e clique em <b>Atualizar Excel</b>. Você pode selecionar mais de um arquivo.</p><p>Um arquivo da mesma unidade, ano e período substitui o fechamento anterior. Outras unidades ou períodos entram nos filtros. Os fechamentos não são somados entre si.</p><p>A importação é local e funciona sem internet em navegadores atuais. Os dados ficam salvos neste navegador quando o armazenamento está disponível. Para usar em outro computador, abra o HTML e importe a planilha atualizada novamente.</p><p>Credenciamento aceita filtro mensal porque tem linhas por mês. Os demais indicadores seguem o período acumulado descrito no Excel.</p>`;$('#modal').showModal()};
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');document.body.append(el);setTimeout(()=>el.remove(),9000)}
// Leitor OOXML local: ZIP central directory + XML. Nenhuma dependência de rede.
async function readXlsx(buffer){const u=new Uint8Array(buffer),v=new DataView(buffer),decoder=new TextDecoder();let end=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('O arquivo não é um .xlsx válido.');let count=v.getUint16(end+10,true),pos=v.getUint32(end+16,true),entries={};for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('Estrutura ZIP inválida.');const method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true),nl=v.getUint16(pos+28,true),el=v.getUint16(pos+30,true),cl=v.getUint16(pos+32,true),off=v.getUint32(pos+42,true),name=decoder.decode(u.slice(pos+46,pos+46+nl));entries[name]={method,size,off};pos+=46+nl+el+cl}
async function xml(name){const e=entries[name];if(!e)return null;let start=e.off+30+v.getUint16(e.off+26,true)+v.getUint16(e.off+28,true),data=u.slice(start,start+e.size);if(e.method===8){try{data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch{throw Error('Não foi possível descompactar o Excel. Use uma versão atual do Chrome ou Edge.')}}else if(e.method!==0)throw Error('Compressão Excel não suportada.');let doc=new DOMParser().parseFromString(decoder.decode(data),'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('XML inválido no Excel.');return doc}
let workbook=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels'),strings=await xml('xl/sharedStrings.xml');if(!workbook||!rels)throw Error('Arquivo Excel inválido.');let ss=strings?Array.from(strings.getElementsByTagName('si'),e=>Array.from(e.getElementsByTagName('t'),t=>t.textContent).join('')):[],targets={};for(const e of rels.getElementsByTagName('Relationship'))targets[e.getAttribute('Id')]=e.getAttribute('Target');let out={};for(const sh of workbook.getElementsByTagName('sheet')){let target=targets[sh.getAttribute('r:id')];if(!target)continue;let path=target.startsWith('/')?target.slice(1):'xl/'+target;path=path.replace('xl/../','');let doc=await xml(path);if(!doc)continue;let rows=[];for(const cell of doc.getElementsByTagName('c')){const ref=cell.getAttribute('r'),match=ref?.match(/^([A-Z]+)(\d+)$/);if(!match)continue;let col=0;for(const l of match[1])col=col*26+l.charCodeAt(0)-64;let ri=+match[2]-1;rows[ri]??=[];let type=cell.getAttribute('t'),value=cell.getElementsByTagName('v')[0]?.textContent;if(type==='s')value=ss[+value];else if(type==='inlineStr')value=Array.from(cell.getElementsByTagName('t'),t=>t.textContent).join('');else if(type==='e')value=value||'Erro de fórmula';else if(value!==undefined&&value!==''&&type!=='str')value=Number(value);rows[ri][col-1]=value??null}out[sh.getAttribute('name')]=Array.from({length:rows.length},(_,i)=>rows[i]||[])}return out}
$('#upload').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let files=Array.from(e.target.files);if(!files.length)return;$('#upload').disabled=true;$('#upload').textContent='Lendo planilha…';try{let incoming=[];for(const file of files){if(!/\.xlsx$/i.test(file.name))throw Error('Selecione arquivos .xlsx.');if(file.size>30e6)throw Error('O arquivo excede o limite de 30 MB.');incoming.push(model(await readXlsx(await file.arrayBuffer()),file.name))}let next=[...datasets];for(const d of incoming){let i=next.findIndex(x=>x.key===d.key);if(i>=0)next[i]=d;else next.push(d)}datasets=next;let persisted=true;try{localStorage.setItem('sesc-n4-v1',JSON.stringify(datasets.map(d=>({raw:d.raw,filename:d.filename}))))}catch{persisted=false}activeActivity=activePackage='';fillFilters();$('#unit').value=incoming.at(-1).unit;fillPeriods();$('#period').value=incoming.at(-1).key;render();toast(`${incoming.length} arquivo(s) atualizado(s). ${persisted?'Dados salvos neste navegador.':'Dados carregados nesta sessão; o navegador não permitiu salvar.'}`)}catch(err){toast('Não foi possível atualizar: '+err.message)}finally{$('#upload').disabled=false;$('#upload').textContent='↑ Atualizar Excel';e.target.value=''}};
fillFilters();
</script></body></html>
