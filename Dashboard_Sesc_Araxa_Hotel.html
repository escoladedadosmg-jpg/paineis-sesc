ontas), chuveiros turbo, licitação do ar-condicionado VRF, telas e cortinas de ar , recreação integral, lembrete de NPS e reuniões semanais. Aguardando / Suspensas (3): Reforma do restaurante, capacitação Senac para cessionário e implantação do caixa flutuante (sistema limitado).🎯 3 Grandes Focos de EntregaQuartos e Conforto: Quartos renovados; modernização da climatização e acessibilidade avançando em blocos específicos.Operação A&B: Gestão do restaurante ajustada com reuniões e checklists diários; melhorias físicas estruturais no local entregam em Junho/26.Experiência (NPS): Atividades de lazer reforçadas e estímulo direto à pesquisa no check-out. Plano de ação detalhado no link e também na pasta: https://sescmg-my.sharepoint.com/:x:/g/personal/leidianyoliveira_sescmg_com_br/EWLQCPPUGsBLg_JaWR7v1SkBjV-ulysuJipohRZEnS-QeQ?e=GbKcS6 "], [null, null, null, null, null, null, null, null], ["Gestão Financeira ", "Execução Financeira - Corrente", null, 5194586, 4811564.39, 0.9262652288363307, "Sem discrepâncias- dentro da meta estabelecida pela instituição", "Sem necessidade de elaboração de plano de ação. Necessário acompanhamento sistemático dos números."], [null, "Execução Financeira - Capital ", null, 497511, 38085.09, 0.07655125213311866, "Trata-se dos itens planejados para todo ano de 2026 no hotel (R$ 955.014,00) :                                                   Sistema VRF de Ar Condicionado – Bloco TiradentesR$ 200.800,00                                         Troca de 110 frigobares das UH'sR$ 276.650,00                                                                            TVs para 105 UH's e demais espaços do HotelR$ 200.000,00                                                      Máquina de lavar louçasR$ 54.138,00                                                                                                 Demais equipamentos e mobiliáriosR$ 23.426,00", "A carteira de investimentos proposta está fortemente concentrada na modernização do Hotel Sesc Ar const fmt = (x, type = "number") =>
    !isnum(x)

const sk = (s) => norm(s).replace(/\s+/g, " ");
const hasText = (v) => v != null && String(v).trim() !== "" && !/^[-–—]$/.test(String(v).trim());
function findSheet(raw, test) {

}
function analysisSheet(raw) {

const OCC = {

  uh: { noun: "UHs ocupadas", lower: "UHs ocupadas", planned: "UHs previstas", ratio: "UHs ocupadas ÷ previstas", rest: "Demais UHs ocupadas", unit: "UHs", tcb: "UHs TCBST + dependentes" },
  pessoas: { noun: "Pessoas atendidas", lower: "pessoas atendidas", planned: "Planejado", ratio: "Realizado ÷ planejado", rest: "Demais pessoas atendidas", unit: "pessoas", tcb: "TCBST + dependentes" },

};
const capFirst = (s) => {

const PLAN_COLS = [

function planText(v, key) {

// Lê a aba "Planos de ação": título na linha 1, cabeçalho na linha 2 e uma ação por linha.

function readPlans(raw) {
  const s = findSheet(raw, (k) => /^planos? de acao$/.test(k));
  if (!s) return null;
  const rows = s.rows,
    col = {};
  let h = rows.findIndex((r, i) => i < 10 && r?.some((c) => /^indicador/.test(sk(c))));
  if (h >= 0)
    rows[h].forEach((c, i) => {
      const t = sk(c),
        found = PLAN_COLS.find(([k, re]) => !(k in col) && re.test(t));
      if (found) col[found[0]] = i;
    });
  else {
    h = 1;
    PLAN_COLS.forEach(([k], i) => (col[k] = i));

  const plans = [];
  let blank = 0;
  rows.slice(h + 1).forEach((r, i) => {
    if (!r) return;

    for (const [k] of PLAN_COLS) p[k] = k in col ? planText(r[col[k]], k) : "";
    if (!PLAN_BODY.some((k) => p[k])) {
      if (p.indicator || p.detail) blank++;
      return;
    }
    p.name = p.detail || p.indicator || "Plano de ação";
    plans.push(p);

  return { plans, blank, sheet: s.name };
}

function legacyPlans(management, expenses) {

const lk = (s) =>

function unitFromNewPattern(filename) {

    throw Error("Cabeçalhos diferentes do modelo N4. Mantenha as colunas originais.");
  const unit = resolvedUnit(filename, p[2]?.[5]);
  if (!unit || /x{3,}/i.test(unit)) throw Error("Informe a unidade no nome do arquivo ou em Panorama!F3 (o marcador “xxxxx” do modelo ainda está lá).");
  if (!isHotelBook(raw) && occupancyKind(a) === "vagas" && !/hotel/.test(norm(unit)))
    throw Error("Esta planilha segue o modelo de unidade (aba Análise das Atividades com vagas). Importe-a no painel de Unidades.");
  const period = String(g[0]?.[0] || "")
    .replace(/^per[ií]odo\s*:\s*/i, "")
    .trim();
  if (!period) throw Error("Informe o período na célula A1 da aba Gestão N4.");
  const year = filename.match(/20\d{2}/)?.[0];
  if (!year) throw Error("Inclua o ano no nome do arquivo, por exemplo N4 - 2026 - Hotel.xlsx.");
  let group = "";
  let management = [];
  g.forEach((r, i) => {
    if (r[0] && /gestao/.test(norm(r[0]))) group = String(r[0]).trim();
    if (r[1] && norm(r[1]) !== "indicadores") {
      const name = String(r[1]).trim();
      management.push({
        name,
        p: n(r[3]),
        r: n(r[4]),
        rawP: r[3],
        rawR: r[4],
        why: r[6],
        action: r[7],
        group,
        row: i + 1,
        type: /^r\$|execu/.test(norm(name)) ? "money" : /^%|nps/.test(norm(name)) ? "pct" : "number",
      });
    }
  });
  // Resultado Operacional (Subsídio): vale o valor digitado em Gestão N4 (colunas D e E).
  // Só quando a célula está vazia ou sem número (ex.: fórmula sem valor salvo) o painel calcula corrente + capital − receita.
  const get = (t) => management.find((x) => norm(x.name).includes(t));
  const current = get("corrente"),
    capital = get("capital"),
    revenue = get("receitas servicos"),
    subsidy = get("subsidio");
  if (current && capital && revenue && subsidy) {
    for (const k of ["p", "r"])
      if (!isnum(subsidy[k]) && [current[k], capital[k], revenue[k]].every(isnum)) {
        subsidy[k] = current[k] + capital[k] - revenue[k];
        subsidy[k === "p" ? "calcP" : "calcR"] = true;
      }
  }
  // Linha sem programa na coluna A herda o da linha anterior quando repete o mesmo nome (ex.: "Hotel Sesc" em duas linhas).
  let lastName = "",
    lastProgram = "";
  const activityNums = ["p", "r", "ep", "er", "peopleP", "peopleR", "tcb", "prodP", "prodR", "uniqueP", "uniqueR"];
  const activities = a
    .slice(4)
    .map((r, i) => {
      const name = hasText(r[1]) ? String(r[1]).trim() : "",
        program = hasText(r[0]) ? String(r[0]).trim() : name && name === lastName ? lastProgram : "";
      lastName = name;
      lastProgram = program;
      return { name, program, ...activityRow(r, i) };
    })
    .filter((r) => r.name && norm(r.name) !== "total geral" && activityNums.some((k) => isnum(r[k])));
  labelActivities(activities);
  function activityRow(r, i) {
    return {
      p: n(r[2]),
      r: n(r[3]),
      ep: n(r[5]),
      er: n(r[6]),
      peopleP: n(r[9]),
      peopleR: n(r[10]),
      tcb: n(r[11]),
      variable: r[14],
      prodP: n(r[15]),
      prodR: n(r[16]),
      variable2: hasText(r[19]) ? r[19] : "PESSOAS ATENDIDAS",
      uniqueP: n(r[20]),
      uniqueR: n(r[21]),
      kind: "activity",
      row: i + 5,
    };
  }
  const expenses = d
    .slice(3)
    .map((r, i) => ({ name: r[1], p: n(r[2]), r: n(r[3]), why: r[6], action: r[7], row: i + 4, type: "money" }))
    .filter((r) => r.name && norm(r.name) !== "total geral" && (isnum(r.p) || isnum(r.r)));
  const credit = c
    .map((r, i) => ({
      month: months.findIndex((m) => norm(m) === norm(r[0])),
      p: n(r[1]),
      r: n(r[2]),
      cp: n(r[4]),
      cr: n(r[5]),
      gp: n(r[7]),
      gr: n(r[8]),
      obs: r[14],
      row: i + 1,
    }))
    .filter((r) => r.month >= 0);
  if (!management.length || !activities.length || !expenses.length)
    throw Error("A planilha está sem valores preenchidos em Gestão N4, " + analysis.name + " ou Despesas. Preencha o modelo antes de importar.");
  const sheetPlans = readPlans(raw),
    plans = sheetPlans ? sheetPlans.plans : legacyPlans(management, expenses);
  linkPlans(plans, management, expenses, activities);
  return {
    raw,
    unit,
    period,
    year,
    filename,
    management,
    activities,
    expenses,
    credit,
    plans,
    planSource: sheetPlans ? "sheet" : "legacy",
    plansBlank: sheetPlans?.blank || 0,
    hasCredit: credit.some((r) => [r.p, r.r, r.cp, r.cr, r.gp, r.gr].some(isnum)),
    analysisName: analysis.name,
    occ: occupancyKind(a),
    occupancyLabel: String(a[2]?.[9] || "Ocupação").trim(),
    key: [norm(unit), year, closingMonth(period) || norm(period)].join("|"),
  };
}

const DB_NAME = "sesc-n4-carteira-v3",
  STORE = "fechamentos";
function openDB() {
  return new Promise((resolve, reject) => {
    let q = indexedDB.open(DB_NAME, 1);
    q.onupgradeneeded = () => {
      if (!q.result.objectStoreNames.contains(STORE)) q.result.createObjectStore(STORE, { keyPath: "id" });
    };
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
}
async function records() {
  let db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      let tx = db.transaction(STORE, "readonly"),
        q = tx.objectStore(STORE).getAll();
      q.onsuccess = () => resolve(q.result);
      q.onerror = () => reject(q.error);
    });
  } finally {
    db.close();
  }
}
async function saveRecords(rows) {
  let db = await openDB();
  try {
    await new Promise((resolve, reject) => {
      let tx = db.transaction(STORE, "readwrite");
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      for (let row of rows) tx.objectStore(STORE).put(row);
    });
  } finally {
    db.close();
  }
}
function closingMonth(period) {
  let matches = [...norm(period).matchAll(/(?:janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/g)];
  return matches.length ? months.findIndex((m) => norm(m) === matches.at(-1)[0]) + 1 : null;
}
function unitFromFile(filename) {
  let s = filename
    .replace(/\.xlsx$/i, "")
    .replace(/\s*\(\d+\)\s*$/, "")
    .replace(/^\s*N4\s*[-–_ ]*\s*20\d{2}\s*[-–_ ]*/i, "")
    .replace(/\s*[-–_]\s*(?:20\d{2})\s*$/, "")
    .trim();
  s = s.replace(/^(Hotel)\s*[-–_]\s*(Sesc\s+.+)$/i, "$1 $2").replace(/^(Sesc\s+.+?)\s*[-–_]\s*(Hotel)$/i, "$2 $1");
  return s;
}
function resolvedUnit(filename, cell) {
  let from = unitFromFile(filename),
    inSheet = String(cell || "").trim();
  if (!from || /^n4(?![a-z0-9])/i.test(from) || /^20\d{2}$/.test(from)) from = unitFromNewPattern(filename);
  if (!from) return inSheet;
  if (!inSheet) return from;
  let words = (x) =>
    norm(x)
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .split(/\s+/)
      .sort()
      .join(" ");
  return words(from) === words(inSheet) ? inSheet : from;
}

async function loadSaved() {

    if (!saved.length) {
      let legacy = JSON.parse(localStorage.getItem("sesc-n4-v1") || "null");

          let d = model(x.raw, x.filename);
          return { id: "hotel" + ":" + d.key, kind: "hotel", key: d.key, raw: x.raw, filename: x.filename };

        await saveRecords(saved);

    let readable = saved.flatMap((x) => {
      try {
        return [model(x.raw, x.filename)];
      } catch (err) {
        console.warn("Base salva ignorada:", x.filename, err.message);
        return [];

function metric(d, name) {

function kpi(label, value, sub, type = "number") {

function card(title, sub, content, cl = "") {

function hit(text, obj) {

function bars(rows, type = "money", ratio = false) {
  if (!rows.length) return empty();
  let h = Math.max(210, rows.length * 44 + 20),
    max = Math.max(1, ...rows.flatMap((r) => (ratio ? [div(r.r, r.p) * 100 || 0] : [r.p || 0, r.r || 0])));
  let s = "";
  rows.forEach((r, i) => {
    let y = 12 + (i * (h - 20)) / rows.length,
      xx = 205,

    let tip = `${r.name}: planejado ${fmt(r.p, r.type || type)}; realizado ${fmt(r.r, r.type || type)}; execução ${fmt(div(r.r, r.p), "pct")}`;
    s += `<g ${hit(tip, { ...r, type: r.type || type })}><text x="0" y="${y + 16}">${esc(String(r.name).slice(0, 27))}</text>`;

    } else {

    }
    s += "</g>";

  return svg(s, h) + (ratio ? "" : legend());
}
function columns(rows, type = "money") {
  let max = Math.max(1, ...rows.flatMap((r) => [r.p || 0, r.r || 0])),
    w = 520 / Math.max(1, rows.length),
    s = "";
  for (let j = 0; j < 4; j++) {
    let y = 185 - j * 50;
    s += `<line x1="55" y1="${y}" x2="585" y2="${y}" stroke="#e3e9f2"/><text x="2" y="${y + 4}">${short((max * j) / 3)}</text>`;
  }
  rows.forEach((r, i) => {
    let x = 60 + i * w;
    s += `<g ${hit(`${r.name}: planejado ${fmt(r.p, r.type || type)}, realizado ${fmt(r.r, r.type || type)}`, { ...r, type: r.type || type })}><rect x="${x + w * 0.13}" y="${185 - ((r.p || 0) / max) * 150}" width="${w * 0.28}" height="${((r.p || 0) / max) * 150}" fill="${mid}" rx="3"/><rect x="${x + w * 0.45}" y="${185 - ((r.r || 0) / max) * 150}" width="${w * 0.28}" height="${((r.r || 0) / max) * 150}" fill="${blue}" rx="3"/><text x="${x + w * 0.43}" y="210" text-anchor="middle">${esc(r.name.slice(0, 19))}</text></g>`;
  });
  return svg(s, 230) + legend();
}
function donut(rows, type = "money", unitLabel = "registros", clickable = true) {
  rows = rows.filter((r) => r.r > 0);
  let total = sum(rows, "r");
  if (!total) return empty();
  let offset = 0,
    s = "";
  rows.forEach((r, i) => {
    let len = (r.r / total) * 502.65;
    let tip = `${r.name}: ${fmt(r.r, r.type || type)} (${fmt(r.r / total, "pct")})`;
    s += `<circle ${clickable ? hit(tip, { ...r, type: r.type || type }) : `data-tip="${esc(tip)}"`} cx="160" cy="120" r="80" fill="none" stroke="${palette[i % 6]}" stroke-width="28" stroke-dasharray="${len} ${502.65 - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 160 120)"/><rect x="295" y="${35 + i * 34}" width="10" height="10" fill="${palette[i % 6]}"/><text x="313" y="${44 + i * 34}">${esc(r.name.slice(0, 28))}</text><text x="555" y="${44 + i * 34}" text-anchor="end">${fmt(r.r / total, "pct")}</text>`;
    offset += len;
  });
  s += `<text x="160" y="117" text-anchor="middle" style="font-size:25px;fill:${blue};font-weight:700">${short(total)}</text><text x="160" y="141" text-anchor="middle">${type === "money" ? "R$ realizados" : esc(unitLabel)}</text>`;
  return svg(s);
}

  rows.forEach(

function variance(rows) {
  let max = Math.max(1, ...rows.map((r) => Math.abs((r.p || 0) - (r.r || 0))));
  let h = Math.max(230, rows.length * 27 + 30),

function activities(d) {
  let o = OCC[d.occ],
    rows = d.activities.filter((r) => !activeActivity || r.name === activeActivity).map((r) => ({ ...r, name: r.label, base: r.name })),
    money = rows.filter((r) => ["p", "r", "ep", "er"].some((k) => isnum(r[k]))),
    production = rows.flatMap((r) => [

// Leitor OOXML local: ZIP central directory + XML. Nenhuma dependência de rede.
async function readXlsx(buffer) {
  const u = new Uint8Array(buffer),
    v = new DataView(buffer),
    decoder = new TextDecoder();
  let end = -1;
  for (let i = u.length - 22; i >= Math.max(0, u.length - 65557); i--)
    if (v.getUint32(i, true) === 0x06054b50) {
      end = i;
      break;
    }
  if (end < 0) throw Error("O arquivo não é um .xlsx válido.");
  let count = v.getUint16(end + 10, true),
    pos = v.getUint32(end + 16, true),
    entries = {};
  for (let i = 0; i < count; i++) {
    if (v.getUint32(pos, true) !== 0x02014b50) throw Error("Estrutura ZIP inválida.");
    const method = v.getUint16(pos + 10, true),
      size = v.getUint32(pos + 20, true),
      nl = v.getUint16(pos + 28, true),
      el = v.getUint16(pos + 30, true),
      cl = v.getUint16(pos + 32, true),
      off = v.getUint32(pos + 42, true),
      name = decoder.decode(u.slice(pos + 46, pos + 46 + nl));
    entries[name] = { method, size, off };
    pos += 46 + nl + el + cl;
  }
  async function xml(name) {
    const e = entries[name];
    if (!e) return null;
    let start = e.off + 30 + v.getUint16(e.off + 26, true) + v.getUint16(e.off + 28, true),
      data = u.slice(start, start + e.size);
    if (e.method === 8) {
      try {
        data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      } catch {
        throw Error("Não foi possível descompactar o Excel. Use uma versão atual do Chrome ou Edge.");
      }
    } else if (e.method !== 0) throw Error("Compressão Excel não suportada.");
    let doc = new DOMParser().parseFromString(decoder.decode(data), "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw Error("XML inválido no Excel.");
    return doc;
  }
  let workbook = await xml("xl/workbook.xml"),
    rels = await xml("xl/_rels/workbook.xml.rels"),
    strings = await xml("xl/sharedStrings.xml");
  if (!workbook || !rels) throw Error("Arquivo Excel inválido.");
  let ss = strings ? Array.from(strings.getElementsByTagName("si"), (e) => Array.from(e.getElementsByTagName("t"), (t) => t.textContent).join("")) : [],
    targets = {};
  for (const e of rels.getElementsByTagName("Relationship")) targets[e.getAttribute("Id")] = e.getAttribute("Target");
  let out = {};
  for (const sh of workbook.getElementsByTagName("sheet")) {
    let target = targets[sh.getAttribute("r:id")];
    if (!target) continue;
    let path = target.startsWith("/") ? target.slice(1) : "xl/" + target;
    path = path.replace("xl/../", "");
    let doc = await xml(path);
    if (!doc) continue;
    let rows = [];
    for (const cell of doc.getElementsByTagName("c")) {
      const ref = cell.getAttribute("r"),
        match = ref?.match(/^([A-Z]+)(\d+)$/);
      if (!match) continue;
      let col = 0;
      for (const l of match[1]) col = col * 26 + l.charCodeAt(0) - 64;
      let ri = +match[2] - 1;
      rows[ri] ??= [];
      let type = cell.getAttribute("t"),
        value = cell.getElementsByTagName("v")[0]?.textContent;
      if (type === "s") value = ss[+value];
      else if (type === "inlineStr") value = Array.from(cell.getElementsByTagName("t"), (t) => t.textContent).join("");
      else if (type === "e") value = value || "Erro de fórmula";
      else if (value !== undefined && value !== "" && type !== "str") value = Number(value);
      rows[ri][col - 1] = value ?? null;
    }
    out[sh.getAttribute("name")] = Array.from({ length: rows.length }, (_, i) => rows[i] || []);
  }
  return out;
}
$("#upload").onclick = () => $("#file").click();
$("#file").onchange = async (e) => {
  let files = Array.from(e.target.files);
  if (!files.length) return;
  $("#upload").disabled = true;
  $("#upload").textContent = "Lendo planilha…";
  try {
    let incoming = [];
    for (const file of files) {
      if (!/\.xlsx$/i.test(file.name)) throw Error("Selecione arquivos .xlsx.");
      if (file.size > 30e6) throw Error("O arquivo excede o limite de 30 MB.");
      incoming.push(model(await readXlsx(await file.arrayBuffer()), file.name));
    }
    let next = [...datasets];
    for (const d of incoming) {
      let i = next.findIndex((x) => x.key === d.key);
      if (i >= 0) next[i] = d;
      else next.push(d);
    }
    datasets = next;
    let persisted = true;
    try {
      await saveRecords(
        datasets.map((d) => ({ id: "hotel:" + d.key, kind: "hotel", key: d.key, raw: d.raw, filename: d.filename, updatedAt: new Date().toISOString() })),
      );
    } catch (err) {
      persisted = false;
      console.warn(err);
    }
    activeActivity = activePackage = planIndicator = planStatus = "";
    fillFilters();
    $("#unit").value = incoming.at(-1).unit;
    fillPeriods();
    $("#period").value = incoming.at(-1).key;
    render();
    toast(
      `${incoming.length} arquivo(s) atualizado(s). ${persisted ? "Dados salvos neste navegador." : "Dados carregados nesta sessão; o navegador não permitiu salvar."}`,
    );
  } catch (err) {
    toast("Não foi possível atualizar: " + err.message);
  } finally {
    $("#upload").disabled = false;
    $("#upload").textContent = "↑ Atualizar Excel";
    e.target.value = "";
  }
};
